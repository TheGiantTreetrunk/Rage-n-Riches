<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fireflies Animation</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      background: url(https://i.pinimg.com/originals/44/6e/3b/446e3b79395a287ca32f7977dd83b290.jpg);
      background-size: cover;
      background-position: center;
    }

    .firefly {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 0.4vw;
      height: 0.4vw;
      margin: -0.2vw 0 0 9.8vw;
      animation: ease 200s alternate infinite;
      pointer-events: none;
    }

    .firefly::before,
    .firefly::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transform-origin: -10vw;
    }

    .firefly::before {
      background: black;
      opacity: 0.4;
      animation: drift ease alternate infinite;
    }

    .firefly::after {
      background: white;
      opacity: 0;
      box-shadow: 0 0 0vw 0vw yellow;
      animation: drift ease alternate infinite, flash ease infinite;
    }

    @keyframes drift {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes flash {
      0%, 30%, 100% {
        opacity: 0;
        box-shadow: 0 0 0vw 0vw yellow;
      }
      5% {
        opacity: 1;
        box-shadow: 0 0 2vw 0.4vw yellow;
      }
    }

    /* Compiled Sass dynamic loops for 15 fireflies */
    .firefly:nth-child(1) { animation-name: move1; }
    .firefly:nth-child(1)::before { animation-duration: 12s; }
    .firefly:nth-child(1)::after { animation-duration: 12s, 8500ms; animation-delay: 0ms, 2100ms; }
    @keyframes move1 {
      0% { transform: translateX(12vw) translateY(-30vh) scale(0.45); }
      25% { transform: translateX(-40vw) translateY(22vh) scale(0.9); }
      50% { transform: translateX(35vw) translateY(-15vh) scale(0.3); }
      75% { transform: translateX(-10vw) translateY(45vh) scale(0.75); }
      100% { transform: translateX(20vw) translateY(-40vh) scale(0.6); }
    }

    .firefly:nth-child(2) { animation-name: move2; }
    .firefly:nth-child(2)::before { animation-duration: 16s; }
    .firefly:nth-child(2)::after { animation-duration: 16s, 6200ms; animation-delay: 0ms, 1200ms; }
    @keyframes move2 {
      0% { transform: translateX(-25vw) translateY(10vh) scale(0.8); }
      33% { transform: translateX(40vw) translateY(-35vh) scale(0.35); }
      66% { transform: translateX(-15vw) translateY(20vh) scale(0.95); }
      100% { transform: translateX(30vw) translateY(-10vh) scale(0.5); }
    }

    .firefly:nth-child(3) { animation-name: move3; }
    .firefly:nth-child(3)::before { animation-duration: 10s; }
    .firefly:nth-child(3)::after { animation-duration: 10s, 9100ms; animation-delay: 0ms, 4500ms; }
    @keyframes move3 {
      0% { transform: translateX(45vw) translateY(35vh) scale(0.3); }
      50% { transform: translateX(-30vw) translateY(-20vh) scale(0.85); }
      100% { transform: translateX(10vw) translateY(15vh) scale(0.4); }
    }

    .firefly:nth-child(4) { animation-name: move4; }
    .firefly:nth-child(4)::before { animation-duration: 14s; }
    .firefly:nth-child(4)::after { animation-duration: 14s, 5400ms; animation-delay: 0ms, 3100ms; }
    @keyframes move4 {
      0% { transform: translateX(-10vw) translateY(-45vh) scale(0.65); }
      50% { transform: translateX(25vw) translateY(30vh) scale(0.4); }
      100% { transform: translateX(-35vw) translateY(-10vh) scale(0.9); }
    }

    .firefly:nth-child(5) { animation-name: move5; }
    .firefly:nth-child(5)::before { animation-duration: 17s; }
    .firefly:nth-child(5)::after { animation-duration: 17s, 7800ms; animation-delay: 0ms, 800ms; }
    @keyframes move5 {
      0% { transform: translateX(30vw) translateY(20vh) scale(0.5); }
      50% { transform: translateX(-20vw) translateY(-40vh) scale(0.7); }
      100% { transform: translateX(40vw) translateY(10vh) scale(0.35); }
    }

    .firefly:nth-child(6) { animation-name: move6; }
    .firefly:nth-child(6)::before { animation-duration: 11s; }
    .firefly:nth-child(6)::after { animation-duration: 11s, 10200ms; animation-delay: 0ms, 5200ms; }
    @keyframes move6 {
      0% { transform: translateX(-40vw) translateY(-15vh) scale(0.9); }
      50% { transform: translateX(15vw) translateY(40vh) scale(0.4); }
      100% { transform: translateX(-25vw) translateY(-30vh) scale(0.75); }
    }

    .firefly:nth-child(7) { animation-name: move7; }
    .firefly:nth-child(7)::before { animation-duration: 15s; }
    .firefly:nth-child(7)::after { animation-duration: 15s, 6800ms; animation-delay: 0ms, 1900ms; }
    @keyframes move7 {
      0% { transform: translateX(18vw) translateY(25vh) scale(0.35); }
      50% { transform: translateX(-35vw) translateY(-10vh) scale(0.8); }
      100% { transform: translateX(5vw) translateY(35vh) scale(0.6); }
    }

    .firefly:nth-child(8) { animation-name: move8; }
    .firefly:nth-child(8)::before { animation-duration: 13s; }
    .firefly:nth-child(8)::after { animation-duration: 13s, 8900ms; animation-delay: 0ms, 6100ms; }
    @keyframes move8 {
      0% { transform: translateX(-15vw) translateY(-20vh) scale(0.75); }
      50% { transform: translateX(42vw) translateY(18vh) scale(0.45); }
      100% { transform: translateX(-8vw) translateY(-35vh) scale(0.95); }
    }

    .firefly:nth-child(9) { animation-name: move9; }
    .firefly:nth-child(9)::before { animation-duration: 18s; }
    .firefly:nth-child(9)::after { animation-duration: 18s, 7200ms; animation-delay: 0ms, 3900ms; }
    @keyframes move9 {
      0% { transform: translateX(22vw) translateY(-38vh) scale(0.5); }
      50% { transform: translateX(-18vw) translateY(28vh) scale(0.85); }
      100% { transform: translateX(33vw) translateY(-12vh) scale(0.3); }
    }

    .firefly:nth-child(10) { animation-name: move10; }
    .firefly:nth-child(10)::before { animation-duration: 9s; }
    .firefly:nth-child(10)::after { animation-duration: 9s, 9500ms; animation-delay: 0ms, 1500ms; }
    @keyframes move10 {
      0% { transform: translateX(-32vw) translateY(12vh) scale(0.85); }
      50% { transform: translateX(28vw) translateY(-25vh) scale(0.4); }
      100% { transform: translateX(-12vw) translateY(38vh) scale(0.65); }
    }

    .firefly:nth-child(11) { animation-name: move11; }
    .firefly:nth-child(11)::before { animation-duration: 14s; }
    .firefly:nth-child(11)::after { animation-duration: 14s, 5900ms; animation-delay: 0ms, 4800ms; }
    @keyframes move11 {
      0% { transform: translateX(38vw) translateY(-18vh) scale(0.4); }
      50% { transform: translateX(-22vw) translateY(32vh) scale(0.7); }
      100% { transform: translateX(14vw) translateY(-22vh) scale(0.9); }
    }

    .firefly:nth-child(12) { animation-name: move12; }
    .firefly:nth-child(12)::before { animation-duration: 12s; }
    .firefly:nth-child(12)::after { animation-duration: 12s, 10800ms; animation-delay: 0ms, 2700ms; }
    @keyframes move12 {
      0% { transform: translateX(-8vw) translateY(42vh) scale(0.6); }
      50% { transform: translateX(31vw) translateY(-14vh) scale(0.95); }
      100% { transform: translateX(-28vw) translateY(22vh) scale(0.35); }
    }

    .firefly:nth-child(13) { animation-name: move13; }
    .firefly:nth-child(13)::before { animation-duration: 16s; }
    .firefly:nth-child(13)::after { animation-duration: 16s, 6400ms; animation-delay: 0ms, 7100ms; }
    @keyframes move13 {
      0% { transform: translateX(27vw) translateY(-32vh) scale(0.7); }
      50% { transform: translateX(-38vw) translateY(15vh) scale(0.3); }
      100% { transform: translateX(19vw) translateY(-8vh) scale(0.8); }
    }

    .firefly:nth-child(14) { animation-name: move14; }
    .firefly:nth-child(14)::before { animation-duration: 10s; }
    .firefly:nth-child(14)::after { animation-duration: 10s, 8100ms; animation-delay: 0ms, 3300ms; }
    @keyframes move14 {
      0% { transform: translateX(-21vw) translateY(-12vh) scale(0.9); }
      50% { transform: translateX(16vw) translateY(36vh) scale(0.5); }
      100% { transform: translateX(-42vw) translateY(-28vh) scale(0.75); }
    }

    .firefly:nth-child(15) { animation-name: move15; }
    .firefly:nth-child(15)::before { animation-duration: 15s; }
    .firefly:nth-child(15)::after { animation-duration: 15s, 7500ms; animation-delay: 0ms, 1800ms; }
    @keyframes move15 {
      0% { transform: translateX(11vw) translateY(22vh) scale(0.35); }
      50% { transform: translateX(-27vw) translateY(-42vh) scale(0.8); }
      100% { transform: translateX(36vw) translateY(18vh) scale(0.55); }
    }
  </style>
</head>
