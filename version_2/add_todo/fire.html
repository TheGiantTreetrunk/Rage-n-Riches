<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Fire Particle Effect</title>
  <style>
  /* Dark background to make the embers pop */
body {
  margin: 0;
  background-color: #0b0200;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  overflow: hidden;
  padding-bottom: 10vh;
}

/* Fire Base Wrapper */
.rb_dung_torch_fire-container {
  position: relative;
  width: 150px;
  height: 200px;
}

/* Soft glowing foundation of the fire */
.rb_dung_torch_fire-glow {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 120px;
  background: radial-gradient(circle, rgba(255,68,0,0.4) 0%, rgba(0,0,0,0) 70%);
  filter: blur(10px);
}

/* Particle Container Area */
.rb_dung_torch_particles {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 100%;
}

/* Individual Spark/Particle Styles */
.rb_dung_torch_particles span {
  position: absolute;
  bottom: 0;
  left: var(--rb_dung_torch_left);
  width: var(--rb_dung_torch_size);
  height: var(--rb_dung_torch_size);
  background: radial-gradient(circle, #ffeb3b 20%, #ff5722 70%, rgba(0,0,0,0) 100%);
  border-radius: 50%;
  opacity: 0;
  box-shadow: 0 0 10px #ff5722, 0 0 20px #ffc107;
  
  /* Apply the rise and lateral drift animations */
  animation: rb_dung_torch_floatUp 3s infinite linear, rb_dung_torch_sway 1.5s infinite ease-in-out alternate;
  animation-delay: var(--rb_dung_torch_delay);
}

/* Keyframes: Lift up, shrink, change color from yellow/orange to transparent */
@keyframes rb_dung_torch_floatUp {
  0% {
    bottom: 0;
    opacity: 0;
    transform: scale(1);
  }
  10% {
    opacity: 1;
  }
  80% {
    opacity: 0.8;
  }
  100% {
    bottom: 100%;
    opacity: 0;
    transform: scale(0.2);
    background: #ff5722;
  }
}

/* Keyframes: Lateral shifting (wind/draft simulation) */
@keyframes rb_dung_torch_sway {
  0% {
    margin-left: -15px;
  }
  100% {
    margin-left: 15px;
  }
}

  </style>
</head>
<body>

  <!-- Fire Container -->
  <div class="rb_dung_torch_fire-container">
    <!-- Fire Base Glow -->
    <div class="rb_dung_torch_fire-glow"></div>
    
    <!-- Particles/Sparks (With Inline Variables for Timing and Positioning) -->
    <div class="rb_dung_torch_particles">
      <span style="--rb_dung_torch_p: 1; --rb_dung_torch_delay: 0s; --rb_dung_torch_left: 20%; --rb_dung_torch_size: 8px;"></span>
      <span style="--rb_dung_torch_p: 2; --rb_dung_torch_delay: 0.4s; --rb_dung_torch_left: 45%; --rb_dung_torch_size: 12px;"></span>
      <span style="--rb_dung_torch_p: 3; --rb_dung_torch_delay: 0.8s; --rb_dung_torch_left: 70%; --rb_dung_torch_size: 6px;"></span>
      <span style="--rb_dung_torch_p: 4; --rb_dung_torch_delay: 1.2s; --rb_dung_torch_left: 30%; --rb_dung_torch_size: 14px;"></span>
      <span style="--rb_dung_torch_p: 5; --rb_dung_torch_delay: 1.6s; --rb_dung_torch_left: 60%; --rb_dung_torch_size: 10px;"></span>
      <span style="--rb_dung_torch_p: 6; --rb_dung_torch_delay: 2.0s; --rb_dung_torch_left: 15%; --rb_dung_torch_size: 7px;"></span>
      <span style="--rb_dung_torch_p: 7; --rb_dung_torch_delay: 2.4s; --rb_dung_torch_left: 80%; --rb_dung_torch_size: 11px;"></span>
      <span style="--rb_dung_torch_p: 8; --rb_dung_torch_delay: 2.8s; --rb_dung_torch_left: 50%; --rb_dung_torch_size: 9px;"></span>
    </div>
  </div>

</body>
</html>
