<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8-Bit Mossy Jungle Texture</title>
  <style>
    :root {
      /* Controls the scale of the pixel blocks */
      --pixel-scale: 8px;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b140b;
    }

    .pixel-moss-bg {
      width: 100%;
      height: 100%;
      background-repeat: repeat;
      
      /* Scales the 32x32 pixel tile up into chunky retro blocks */
      background-size: calc(32 * var(--pixel-scale)) calc(32 * var(--pixel-scale));

      /* Force crisp, un-blurred pixel edges across all browsers */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      image-rendering: -moz-crisp-edges;
    }
  </style>
</head>
<body>

  <div id="mossBg" class="pixel-moss-bg"></div>

  <script>
    function generate8BitMoss() {
      const size = 32; // 32x32 pixel canvas
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Limited 4-color retro jungle moss palette (Deep Shadow to Canopy Highlight)
      const PALETTE = [
        '#0d1f0d', // Deep undergrowth shadow
        '#1f3a13', // Dark moss green
        '#3b5f1a', // Mid-tone leafy green
        '#6d8e2b'  // Bright moss highlight
      ];

      function pseudoRandom(x, y) {
        const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
        return n - Math.floor(n);
      }

      // Step 1: Base layer (Mid-tone moss)
      ctx.fillStyle = PALETTE[2];
      ctx.fillRect(0, 0, size, size);

      // Step 2: Generate organic 2x2 pixel moss clusters & shadow pockets
      for (let y = 0; y < size; y += 2) {
        for (let x = 0; x < size; x += 2) {
          const rand = pseudoRandom(x, y);

          if (rand < 0.22) {
            ctx.fillStyle = PALETTE[0]; // Deep shadow cavity
          } else if (rand < 0.52) {
            ctx.fillStyle = PALETTE[1]; // Dark foliage
          } else if (rand > 0.80) {
            ctx.fillStyle = PALETTE[3]; // Sunlit top cluster
          } else {
            continue; // Keep base color
          }

          ctx.fillRect(x, y, 2, 2);
        }
      }

      // Step 3: Layer leafy "clump" overlays (4x2 and 2x4 pixel patches)
      for (let y = 0; y < size; y += 4) {
        for (let x = 0; x < size; x += 4) {
          const clumpRand = pseudoRandom(x * 2.5, y * 2.5);

          if (clumpRand > 0.65) {
            // Bright canopy highlights on top of clumps
            ctx.fillStyle = PALETTE[3];
            ctx.fillRect(x, y, 4, 2);
            ctx.fillRect(x + 2, y + 2, 2, 2);
          } else if (clumpRand < 0.25) {
            // Shadow under foliage overhangs
            ctx.fillStyle = PALETTE[0];
            ctx.fillRect(x, y + 2, 4, 2);
          }
        }
      }

      // Set canvas data as repeating background
      const dataUrl = canvas.toDataURL('image/png');
      document.getElementById('mossBg').style.backgroundImage = `url(${dataUrl})`;
    }

    generate8BitMoss();
  </script>
</body>
</html>
