<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Quest System</title>
    <style>
        /* CSS: Styling the UI */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .game-card {
            background-color: #34495e;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .stats-bar {
            background: #1abc9c;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        .quest-container {
            margin-bottom: 20px;
        }

        .quest {
            background: #2c3e50;
            border: 2px solid #444;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .quest.completed {
            border-color: #1abc9c;
            opacity: 0.7;
        }

        .quest h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
        }

        .quest p {
            margin: 0;
            font-size: 0.9rem;
            color: #bdc3c7;
        }

        .progress-text {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #f1c40f;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #3498db;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        button:active {
            transform: translateY(2px);
        }
    </style>
</head>
<body>

    <div class="game-card">
        <div class="stats-bar">
            Player XP: <span id="player-xp">0</span>
        </div>

        <h2>Active Quests</h2>
        <div id="quest-list" class="quest-container">
            </div>

        <hr style="border: 0; border-top: 1px solid #555; margin: 20px 0;">

        <div class="actions">
            <button onclick="performAction('wood')">🪓 Chop Wood</button>
            <button onclick="performAction('slime')">⚔️ Slay Slime</button>
        </div>
    </div>

    <script>
        /* JavaScript: Logic & State Management */

        // 1. Game State
        let playerXP = 0;

        const quests = [
            {
                id: 1,
                title: "The Lumberjack",
                description: "The village needs wood for the winter.",
                targetType: "wood",
                required: 5,
                current: 0,
                reward: 50,
                completed: false
            },
            {
                id: 2,
                title: "Slime Menace",
                description: "Clear out the local slimes.",
                targetType: "slime",
                required: 3,
                current: 0,
                reward: 100,
                completed: false
            }
        ];

        // 2. Render Function (Updates the UI)
        function render() {
            // Update XP display
            document.getElementById('player-xp').innerText = playerXP;

            // Update Quest List
            const questList = document.getElementById('quest-list');
            questList.innerHTML = '';

            quests.forEach(quest => {
                const questDiv = document.createElement('div');
                questDiv.className = `quest ${quest.completed ? 'completed' : ''}`;
                
                questDiv.innerHTML = `
                    <h3>${quest.title} ${quest.completed ? '✅' : ''}</h3>
                    <p>${quest.description}</p>
                    <span class="progress-text">
                        ${quest.completed ? 'DONE' : `Progress: ${quest.current} / ${quest.required}`}
                    </span>
                `;
                questList.appendChild(questDiv);
            });
        }

        // 3. Action Logic
        function performAction(type) {
            quests.forEach(quest => {
                // Only progress if types match AND quest isn't finished
                if (quest.targetType === type && !quest.completed) {
                    quest.current++;

                    // Check for completion
                    if (quest.current >= quest.required) {
                        quest.completed = true;
                        playerXP += quest.reward; // Grant reward
                        console.log(`Finished ${quest.title}! Gained ${quest.reward} XP.`);
                    }
                }
            });

            render(); // Refresh the screen
        }

        // Initialize the view on load
        render();
    </script>
</body>
</html>
