<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8-Bit Desert Mesa Texture</title>
  <style>
    :root {
      /* Controls the scale of the pixel blocks */
      --pixel-scale: 8px;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #2b120a;
    }

    .pixel-desert-bg {
      width: 100%;
      height: 100%;
      background-repeat: repeat;
      
      /* Scales the 32x32 pixel tile up into chunky retro blocks */
      background-size: calc(32 * var(--pixel-scale)) calc(32 * var(--pixel-scale));

      /* Force crisp, un-blurred pixel edges across all browsers */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      image-rendering: -moz-crisp-edges;
    }
  </style>
</head>
<body>

  <div id="desertBg" class="pixel-desert-bg"></div>

  <script>
    function generate8BitDesert() {
      const size = 32; // 32x32 pixel canvas
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Limited 4-color NES desert/mesa palette (Terracotta Shadow to Sunbaked Sand)
      const PALETTE = [
        '#612314', // Deep red-clay shadow / cliff crevice
        '#9e4722', // Terracotta mid-tone
        '#d47c3b', // Warm mesa orange
        '#f2b166'  // Sunbleached sand highlight
      ];

      function pseudoRandom(x, y) {
        const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
        return n - Math.floor(n);
      }

      // Step 1: Base coat with warm mesa orange (#d47c3b)
      ctx.fillStyle = PALETTE[2];
      ctx.fillRect(0, 0, size, size);

      // Step 2: Generate horizontal dune lines and stratified clay layers
      for (let y = 0; y < size; y += 2) {
        for (let x = 0; x < size; x += 2) {
          const rand = pseudoRandom(x, y);

          if (rand < 0.18) {
            ctx.fillStyle = PALETTE[0]; // Deep canyon shadow
          } else if (rand < 0.42) {
            ctx.fillStyle = PALETTE[1]; // Red clay stratum
          } else if (rand > 0.68) {
            ctx.fillStyle = PALETTE[3]; // Bright sand ridge
          } else {
            continue; // Keep base color
          }

          ctx.fillRect(x, y, 2, 2);
        }
      }

      // Step 3: Layer long horizontal dune crests (6x2 and 4x2 pixel blocks)
      for (let y = 0; y < size; y += 4) {
        for (let x = 0; x < size; x += 4) {
          const duneRand = pseudoRandom(x * 1.4, y * 1.4);

          if (duneRand > 0.55) {
            // Sunlit sand dune crests
            ctx.fillStyle = PALETTE[3];
            ctx.fillRect(x, y, 6, 2);
            ctx.fillRect(x + 2, y + 2, 2, 2);
          } else if (duneRand < 0.22) {
            // Shadow behind dune crests / mesa ledges
            ctx.fillStyle = PALETTE[0];
            ctx.fillRect(x, y + 2, 4, 2);
          }
        }
      }

      // Set canvas data as repeating background
      const dataUrl = canvas.toDataURL('image/png');
      document.getElementById('desertBg').style.backgroundImage = `url(${dataUrl})`;
    }

    generate8BitDesert();
  </script>
</body>
</html>
