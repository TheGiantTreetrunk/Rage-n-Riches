<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7x7 Isometric Dungeon - Single Door Boss Room</title>
    <style>
        @font-face {
            font-family: 'DungeonFont';
            src: url('../font/test.ttf') format('truetype');
        }

        :root {
            --grid-size: 7;
            --cell-size: 44px;
            --grid-gap: 2px;
            --font-size: 38px;

            --floor-offset-y: 6px;  
            --floor-offset-x: 0px;  
            
            --player-offset-y: -10px; 
            --item-offset-y: -8px;
            --door-offset-y: -6px;
        }

        * { box-sizing: border-box; }

        body {
            background-color: #0b0c10;
            color: #66fcf1;
            font-family: 'DungeonFont', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #hud {
            display: flex;
            gap: 24px;
            margin-bottom: 10px;
            font-family: system-ui, sans-serif;
            font-size: 1.1rem;
            color: #45a29e;
        }

        #instructions {
            margin-bottom: 15px;
            font-family: system-ui, sans-serif;
            font-size: 0.9rem;
            color: #c5c6c7;
            text-align: center;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 65vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        #game-board {
            position: relative;
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: var(--grid-gap);
            transform-style: preserve-3d;
            transform: rotateX(60deg) rotateZ(-45deg);
            background-color: transparent;
        }

        .tile {
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .tile-glyph {
            display: inline-block;
            font-size: var(--font-size);
            color: #45a29e;
            user-select: none;
            line-height: 1;
            text-shadow: 0 0 6px rgba(69, 162, 158, 0.4);
            transform: translate(var(--floor-offset-x), var(--floor-offset-y));
        }

        .tile-wall {
            color: #1f2833;
            text-shadow: none;
        }

        .item-node, .door-node {
            position: absolute;
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        .item-text {
            display: flex;
            justify-content: center;
            align-items: center;
            width: var(--cell-size);
            height: var(--cell-size);
            font-size: var(--font-size);
            line-height: 1;
            user-select: none;
            transform: rotateZ(45deg) rotateX(-60deg) translateY(var(--item-offset-y));
        }

        .door-text {
            display: flex;
            justify-content: center;
            align-items: center;
            width: var(--cell-size);
            height: var(--cell-size);
            font-size: calc(var(--font-size) * 0.9);
            color: #e0a96d;
            text-shadow: 0 0 8px rgba(224, 169, 109, 0.8);
            line-height: 1;
            user-select: none;
        }

        .door-locked {
            color: #e63946;
            text-shadow: 0 0 10px rgba(230, 57, 70, 0.9);
        }

        .door-north, .door-south {
            transform: rotateZ(45deg) rotateX(-60deg) skewY(-26.5deg) translateY(var(--door-offset-y));
        }

        .door-west, .door-east {
            transform: rotateZ(45deg) rotateX(-60deg) skewY(26.5deg) translateY(var(--door-offset-y));
        }

        /* Item & Feature Styles */
        .item-chest          { color: #d4a373; text-shadow: 0 0 8px rgba(212, 163, 115, 0.6); }
        .item-vase           { color: #e76f51; text-shadow: 0 0 8px rgba(231, 111, 81, 0.6); }
        .item-torch          { color: #f4a261; text-shadow: 0 0 10px rgba(244, 162, 97, 0.9); }
        .item-rock           { color: #8d99ae; text-shadow: 0 0 6px rgba(141, 153, 174, 0.5); }
        .item-demon          { color: #d62828; text-shadow: 0 0 12px rgba(214, 40, 40, 0.9); }
        .item-ghost          { color: #a8dede; text-shadow: 0 0 12px rgba(168, 222, 222, 0.9); }
        .item-boss           { color: #9d4edd; text-shadow: 0 0 16px rgba(157, 78, 221, 1.0); font-weight: bold; }
        
        .item-fountain       { color: #00b4d8; text-shadow: 0 0 12px rgba(0, 180, 216, 0.9); }
        .item-fountain-used  { color: #4a5568; text-shadow: none; opacity: 0.6; }
        .item-water          { color: #0077b6; text-shadow: 0 0 8px rgba(0, 119, 182, 0.7); }
        .item-water-used     { color: #3a506b; text-shadow: none; opacity: 0.5; }
        
        .item-grass          { color: #52b788; text-shadow: 0 0 6px rgba(82, 183, 136, 0.6); }
        .item-trap           { color: #ff4d6d; text-shadow: 0 0 10px rgba(255, 77, 109, 0.8); }

        #player {
            position: absolute;
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transition: transform 0.12s ease-out;
            transform-style: preserve-3d;
            z-index: 10;
        }

        .player-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: rotateZ(45deg) rotateX(-60deg) translateY(var(--player-offset-y));
        }

        .player-text {
            font-size: calc(var(--font-size) * 1.1);
            color: #ffe600;
            text-shadow: 0 0 10px rgba(255, 230, 0, 0.8);
            line-height: 1;
            user-select: none;
        }

        .facing-indicator {
            display: none;
            font-size: 14px;
            color: #66fcf1;
            text-shadow: 0 0 6px rgba(102, 252, 241, 0.9);
            font-family: system-ui, sans-serif;
            font-weight: bold;
            margin-top: -6px;
            user-select: none;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div>Floor: <span id="ui-floor">1</span></div>
        <div>Room: <span id="ui-room">1 / 6</span></div>
        <div>Score: <span id="ui-score">0</span></div>
        <div>Facing: <span id="ui-facing">SOUTH</span></div>
    </div>
    <div id="instructions">
        Move: <b>W, A, S, D / Arrows</b> | Interact / Drink / Challenge: <b>Space / E</b>
    </div>
    <div id="viewport">
        <div id="game-board"></div>
    </div>

    <script>
        const GRID_SIZE = 7;
        const CELL_SIZE = 44;
        const GRID_GAP = 2; 
        const STEP = CELL_SIZE + GRID_GAP; 
        const TOTAL_ROOMS = 6;

        const board = document.getElementById('game-board');
        const uiFloor = document.getElementById('ui-floor');
        const uiRoom = document.getElementById('ui-room');
        const uiScore = document.getElementById('ui-score');
        const uiFacing = document.getElementById('ui-facing');

        const TORCH_CHAR = 'Z';
        const DOOR_CHAR = ':';
        const FOUNTAIN_CHAR = 'F';
        const WATER_CHAR = '~';
        const GRASS_CHAR = '"';
        const TRAP_CHAR = '^';
        const BOSS_CHAR = 'U';

        let currentFloorNum = 1;
        let currentRoomIndex = 0;
        let playerScore = 0;
        let playerPos = { x: 3, y: 3 };
        let playerFacing = 'SOUTH';
        let playerElement = null;
        let facingIndicatorElement = null;

        let currentFloorRooms = [];
        let activeLayout = [];
        let itemElements = {};
        let doorData = {};

        const WALL_DIRS = ['NORTH', 'EAST', 'SOUTH', 'WEST'];
        const OPPOSITE_WALL = {
            'NORTH': 'SOUTH',
            'SOUTH': 'NORTH',
            'EAST':  'WEST',
            'WEST':  'EAST'
        };

        const DIR_OFFSETS = {
            'NORTH': { x: 0, y: -1 },
            'SOUTH': { x: 0, y: 1 },
            'WEST':  { x: -1, y: 0 },
            'EAST':  { x: 1, y: 0 }
        };

        const FACING_ARROWS = {
            'NORTH': '▲',
            'SOUTH': '▼',
            'WEST':  '◄',
            'EAST':  '►'
        };

        const DOOR_COORDS = {
            'NORTH': { x: 3, y: 0 },
            'SOUTH': { x: 3, y: 6 },
            'WEST':  { x: 0, y: 3 },
            'EAST':  { x: 6, y: 3 }
        };

        const ENTRY_SPAWNS = {
            'NORTH': { x: 3, y: 1 },
            'SOUTH': { x: 3, y: 5 },
            'WEST':  { x: 1, y: 3 },
            'EAST':  { x: 5, y: 3 }
        };

        function findAssociatedFountain(x, y) {
            const roomItems = currentFloorRooms[currentRoomIndex].items;
            const item = roomItems[`${x},${y}`];
            if (item && item.fountainKey && roomItems[item.fountainKey]) {
                return { key: item.fountainKey, data: roomItems[item.fountainKey] };
            }
            return null;
        }

        function pickLockDoor(doorObj, onComplete) {
            alert("Attempting to pick the lock!");
            doorObj.isLocked = false;
            if (onComplete) onComplete(true);
        }

        function breakDownDoor(doorObj, onComplete) {
            alert("Breaking down the door!");
            doorObj.isLocked = false;
            if (onComplete) onComplete(true);
        }

        function triggerChallenge(entityType, itemData, onComplete) {
            if (entityType === 'D') {
                alert("A Demon approaches! Triggering Combat Challenge.");
                if (onComplete) onComplete(true);
            } else if (entityType === 'G') {
                alert("A Ghost appears! Triggering Puzzle Challenge.");
                if (onComplete) onComplete(true);
            } else if (entityType === 'F') {
                if (itemData && itemData.isUsed) {
                    alert("The fountain water is still and depleted.");
                    return;
                }

                const acceptChallenge = confirm("You approach the pool of glowing water in front of the Fountain.\n\nAccept the Sacred Challenge for a blessing?");
                if (acceptChallenge) {
                    alert("Challenge Passed! You drink from the glowing waters and gain +100 points.");
                    playerScore += 100;
                    uiScore.innerText = playerScore;

                    if (itemData) {
                        itemData.isUsed = true;
                    }
                    if (onComplete) onComplete(true);
                }
            } else if (entityType === 'U') {
                alert("BOSS BATTLE INITIATED!\n\nYou challenge the Grave Lord in mortal combat!");
                alert("VICTORY! You defeated the Boss and earned +500 points!");
                
                playerScore += 500;
                uiScore.innerText = playerScore;

                if (itemData) itemData.state = 'DESTROYED';
                currentFloorRooms[5].bossDefeated = true;

                alert("The dungeon shifts and reshapes around you... Descending to Floor " + (currentFloorNum + 1) + "!");
                
                currentFloorNum++;
                uiFloor.innerText = currentFloorNum;
                generateFloorData();
                loadRoom(0);
            }
        }

        function triggerDoorChallenge() {
            const isFight = Math.random() < 0.5;
            if (isFight) {
                alert("Ambush! Enemies attack as you open the door!");
            } else {
                alert("Trap triggered! The room is flooding with water!");
            }
        }

        function generateFloorData() {
            currentFloorRooms = [];

            // Room 1: Starting Room
            const firstExit = WALL_DIRS[Math.floor(Math.random() * WALL_DIRS.length)];
            currentFloorRooms.push({
                index: 0,
                entryWall: null,
                forwardWall: firstExit,
                doors: {
                    [firstExit]: { type: 'FORWARD', isLocked: false, targetRoom: 1 }
                },
                items: {}
            });

            // Rooms 2 to 5 (Standard Procedural Rooms)
            for (let i = 1; i < TOTAL_ROOMS - 1; i++) {
                const prevRoom = currentFloorRooms[i - 1];
                const entryWall = OPPOSITE_WALL[prevRoom.forwardWall];
                
                const availableWalls = WALL_DIRS.filter(w => w !== entryWall);
                const forwardWall = availableWalls[Math.floor(Math.random() * availableWalls.length)];

                const isLocked = Math.random() < 0.35;

                const roomObj = {
                    index: i,
                    entryWall: entryWall,
                    forwardWall: forwardWall,
                    doors: {
                        [entryWall]: { type: 'BACKWARD', isLocked: false, targetRoom: i - 1 },
                        [forwardWall]: { type: 'FORWARD', isLocked: isLocked, targetRoom: i + 1 }
                    },
                    items: {}
                };

                roomObj.items = generateRoomItems(roomObj);
                currentFloorRooms.push(roomObj);
            }

            // Room 6: Boss Arena (Single Entrance Door Only)
            const prevRoom = currentFloorRooms[4];
            const entryWall = OPPOSITE_WALL[prevRoom.forwardWall];

            const bossRoomObj = {
                index: 5,
                entryWall: entryWall,
                forwardWall: null,
                bossDefeated: false,
                doors: {
                    [entryWall]: { type: 'BACKWARD', isLocked: false, targetRoom: 4 }
                },
                items: {
                    '1,1': { char: TORCH_CHAR, state: 'INTACT' },
                    '5,1': { char: TORCH_CHAR, state: 'INTACT' },
                    '1,5': { char: TORCH_CHAR, state: 'INTACT' },
                    '5,5': { char: TORCH_CHAR, state: 'INTACT' },
                    '3,3': { char: BOSS_CHAR, state: 'ACTIVE' }
                }
            };
            currentFloorRooms.push(bossRoomObj);
        }

        function generateRoomItems(roomObj) {
            let items = {};
            let isValidLayout = false;
            let attempts = 0;

            const doorClearanceTiles = new Set([
                '3,1', '2,1', '4,1',
                '3,5', '2,5', '4,5',
                '1,3', '1,2', '1,4',
                '5,3', '5,2', '5,4'
            ]);

            while (!isValidLayout && attempts < 50) {
                attempts++;
                items = {};

                if (Math.random() < 0.6) {
                    const corners = [
                        { fx: 1, fy: 1, w: [{x:2, y:1}, {x:1, y:2}] },
                        { fx: 5, fy: 1, w: [{x:4, y:1}, {x:5, y:2}] },
                        { fx: 1, fy: 5, w: [{x:1, y:4}, {x:2, y:5}] },
                        { fx: 5, fy: 5, w: [{x:5, y:4}, {x:4, y:5}] }
                    ];
                    const chosenCorner = corners[Math.floor(Math.random() * corners.length)];
                    const fKey = `${chosenCorner.fx},${chosenCorner.fy}`;

                    items[fKey] = { char: FOUNTAIN_CHAR, state: 'SOLID', isUsed: false };

                    for (const wt of chosenCorner.w) {
                        const wKey = `${wt.x},${wt.y}`;
                        items[wKey] = { char: WATER_CHAR, state: 'SOLID', fountainKey: fKey };
                    }
                }

                if (Math.random() < 0.5) {
                    const isHorizontal = Math.random() < 0.5;
                    if (isHorizontal) {
                        const trapY = Math.random() < 0.5 ? 2 : 4;
                        for (let tx = 1; tx <= 5; tx++) {
                            const key = `${tx},${trapY}`;
                            if (!items[key]) {
                                items[key] = { char: TRAP_CHAR, state: 'TRAP' };
                            }
                        }
                    } else {
                        const trapX = Math.random() < 0.5 ? 2 : 4;
                        for (let ty = 1; ty <= 5; ty++) {
                            const key = `${trapX},${ty}`;
                            if (!items[key]) {
                                items[key] = { char: TRAP_CHAR, state: 'TRAP' };
                            }
                        }
                    }
                }

                if (Math.random() < 0.5) {
                    const grassCount = Math.floor(Math.random() * 2) + 5;
                    let gx = Math.floor(Math.random() * 5) + 1;
                    let gy = Math.floor(Math.random() * 5) + 1;

                    for (let g = 0; g < grassCount; g++) {
                        const key = `${gx},${gy}`;
                        if (!doorClearanceTiles.has(key) && !items[key]) {
                            items[key] = { char: GRASS_CHAR, state: 'WALKABLE' };
                        }
                        gx = Math.min(5, Math.max(1, gx + (Math.floor(Math.random() * 3) - 1)));
                        gy = Math.min(5, Math.max(1, gy + (Math.floor(Math.random() * 3) - 1)));
                    }
                }

                const possibleItems = ['(', '<', '*', TORCH_CHAR];
                const itemCount = Math.floor(Math.random() * 3) + 2;

                for (let i = 0; i < itemCount; i++) {
                    const rx = Math.floor(Math.random() * 5) + 1;
                    const ry = Math.floor(Math.random() * 5) + 1;
                    const key = `${rx},${ry}`;

                    if (doorClearanceTiles.has(key) || items[key]) continue;

                    const char = possibleItems[Math.floor(Math.random() * possibleItems.length)];
                    items[key] = { char: char, state: 'INTACT' };
                }

                if (Math.random() < 0.5) {
                    const cx = Math.floor(Math.random() * 3) + 2;
                    const cy = Math.floor(Math.random() * 3) + 2;
                    const key = `${cx},${cy}`;

                    if (!doorClearanceTiles.has(key) && !items[key]) {
                        const entityChar = Math.random() < 0.5 ? '?' : '&';
                        items[key] = { char: entityChar, state: 'ACTIVE' };
                    }
                }

                isValidLayout = validateRoomPathways(items, roomObj);
            }

            return items;
        }

        function validateRoomPathways(items, roomObj) {
            if (!roomObj || !roomObj.doors) return true;

            const activeSpawnPoints = [];
            for (const wall of Object.keys(roomObj.doors)) {
                activeSpawnPoints.push(ENTRY_SPAWNS[wall]);
            }

            if (activeSpawnPoints.length < 2) return true;

            const start = activeSpawnPoints[0];
            const queue = [start];
            const visited = new Set([`${start.x},${start.y}`]);

            while (queue.length > 0) {
                const curr = queue.shift();

                const neighbors = [
                    { x: curr.x, y: curr.y - 1 },
                    { x: curr.x, y: curr.y + 1 },
                    { x: curr.x - 1, y: curr.y },
                    { x: curr.x + 1, y: curr.y }
                ];

                for (const n of neighbors) {
                    if (n.x < 1 || n.x > 5 || n.y < 1 || n.y > 5) continue;
                    
                    const key = `${n.x},${n.y}`;
                    if (visited.has(key)) continue;

                    const item = items[key];
                    if (item && (item.state === 'SOLID' || item.state === 'INTACT' || item.state === 'ACTIVE' || item.char === FOUNTAIN_CHAR)) continue;

                    visited.add(key);
                    queue.push(n);
                }
            }

            return activeSpawnPoints.every(pt => visited.has(`${pt.x},${pt.y}`));
        }

        function loadRoom(roomIdx, entryDirection = null) {
            currentRoomIndex = roomIdx;
            uiRoom.innerText = `${currentRoomIndex + 1} / ${TOTAL_ROOMS}`;

            const roomData = currentFloorRooms[roomIdx];
            doorData = roomData.doors;

            activeLayout = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(' '));

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (r === 0 || r === GRID_SIZE - 1 || c === 0 || c === GRID_SIZE - 1) {
                        activeLayout[r][c] = 'W';
                    }
                }
            }

            for (const [wall, dInfo] of Object.entries(doorData)) {
                const coord = DOOR_COORDS[wall];
                activeLayout[coord.y][coord.x] = DOOR_CHAR;
            }

            for (const [posKey, item] of Object.entries(roomData.items)) {
                const [ix, iy] = posKey.split(',').map(Number);
                if (item.state !== 'DESTROYED') {
                    activeLayout[iy][ix] = item.char;
                }
            }

            if (entryDirection && ENTRY_SPAWNS[entryDirection]) {
                playerPos = { ...ENTRY_SPAWNS[entryDirection] };
                playerFacing = OPPOSITE_WALL[entryDirection];
            } else {
                playerPos = { x: 3, y: 3 };
                playerFacing = 'SOUTH';
            }

            renderBoard();
        }

        function renderBoard() {
            board.innerHTML = '';
            itemElements = {};

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    
                    const glyph = document.createElement('span');
                    glyph.classList.add('tile-glyph');

                    const isWallBoundary = (r === 0 || r === GRID_SIZE - 1 || c === 0 || c === GRID_SIZE - 1);

                    if (isWallBoundary) {
                        glyph.innerText = ' ';
                        glyph.classList.add('tile-wall');
                    } else {
                        glyph.innerText = '#';
                    }
                    
                    tile.appendChild(glyph);
                    board.appendChild(tile);
                }
            }

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const char = activeLayout[r][c];

                    if (char === DOOR_CHAR) {
                        spawnDoor(c, r);
                    } else if (char !== ' ' && char !== 'W') {
                        spawnItem(c, r, char);
                    }
                }
            }

            spawnPlayer();
        }

        function spawnDoor(x, y) {
            const doorNode = document.createElement('div');
            doorNode.classList.add('door-node');
            doorNode.style.transform = `translate3d(${x * STEP}px, ${y * STEP}px, 0px)`;

            const doorText = document.createElement('div');
            doorText.classList.add('door-text');

            let wallKey = null;
            if (y === 0) { doorText.classList.add('door-north'); wallKey = 'NORTH'; }
            else if (y === GRID_SIZE - 1) { doorText.classList.add('door-south'); wallKey = 'SOUTH'; }
            else if (x === 0) { doorText.classList.add('door-west'); wallKey = 'WEST'; }
            else if (x === GRID_SIZE - 1) { doorText.classList.add('door-east'); wallKey = 'EAST'; }

            const dObj = doorData[wallKey];
            if (dObj && dObj.isLocked) {
                doorText.classList.add('door-locked');
            }

            doorText.innerText = DOOR_CHAR;
            doorNode.appendChild(doorText);
            board.appendChild(doorNode);
        }

        function spawnItem(x, y, char) {
            const itemNode = document.createElement('div');
            itemNode.classList.add('item-node');
            itemNode.style.transform = `translate3d(${x * STEP}px, ${y * STEP}px, 0px)`;

            const itemText = document.createElement('div');
            itemText.classList.add('item-text');
            itemText.innerText = char;

            const roomItems = currentFloorRooms[currentRoomIndex].items;
            const itemData = roomItems[`${x},${y}`];

            if (char === '(' || char === ')') itemText.classList.add('item-chest');
            else if (char === '<') itemText.classList.add('item-vase');
            else if (char === TORCH_CHAR) itemText.classList.add('item-torch');
            else if (char === '*') itemText.classList.add('item-rock');
            else if (char === '?') itemText.classList.add('item-demon');
            else if (char === '&') itemText.classList.add('item-ghost');
            else if (char === BOSS_CHAR) itemText.classList.add('item-boss');
            else if (char === FOUNTAIN_CHAR) {
                if (itemData && itemData.isUsed) {
                    itemText.classList.add('item-fountain-used');
                } else {
                    itemText.classList.add('item-fountain');
                }
            }
            else if (char === WATER_CHAR) {
                const parentFountain = findAssociatedFountain(x, y);
                if (parentFountain && parentFountain.data.isUsed) {
                    itemText.classList.add('item-water-used');
                } else {
                    itemText.classList.add('item-water');
                }
            }
            else if (char === GRASS_CHAR) itemText.classList.add('item-grass');
            else if (char === TRAP_CHAR) itemText.classList.add('item-trap');

            itemNode.appendChild(itemText);
            board.appendChild(itemNode);

            itemElements[`${x},${y}`] = itemText;
        }

        function spawnPlayer() {
            playerElement = document.createElement('div');
            playerElement.id = 'player';

            const wrapper = document.createElement('div');
            wrapper.classList.add('player-wrapper');

            const sprite = document.createElement('div');
            sprite.classList.add('player-text');
            sprite.innerText = '@';

            facingIndicatorElement = document.createElement('div');
            facingIndicatorElement.classList.add('facing-indicator');

            wrapper.appendChild(sprite);
            wrapper.appendChild(facingIndicatorElement);
            playerElement.appendChild(wrapper);
            board.appendChild(playerElement);

            updatePlayerRender();
        }

        function updatePlayerRender() {
            playerElement.style.transform = `translate3d(${playerPos.x * STEP}px, ${playerPos.y * STEP}px, 0px)`;
            facingIndicatorElement.innerText = FACING_ARROWS[playerFacing];
            uiFacing.innerText = playerFacing;
        }

        function isWalkable(x, y) {
            if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) return false;

            const char = activeLayout[y][x];
            if (char === 'W') return false;
            if (['(', '<', '*', TORCH_CHAR, '?', '&', BOSS_CHAR, FOUNTAIN_CHAR, WATER_CHAR, TRAP_CHAR].includes(char)) return false;

            return true;
        }

        function movePlayer(dx, dy, newFacing) {
            playerFacing = newFacing;

            const targetX = playerPos.x + dx;
            const targetY = playerPos.y + dy;

            if (isWalkable(targetX, targetY)) {
                playerPos.x = targetX;
                playerPos.y = targetY;

                if (activeLayout[targetY][targetX] === DOOR_CHAR) {
                    handleDoorStep(targetX, targetY);
                }
            }

            updatePlayerRender();
        }

        function handleDoorStep(x, y) {
            let wallKey = null;
            if (y === 0) wallKey = 'NORTH';
            else if (y === GRID_SIZE - 1) wallKey = 'SOUTH';
            else if (x === 0) wallKey = 'WEST';
            else if (x === GRID_SIZE - 1) wallKey = 'EAST';

            const doorObj = doorData[wallKey];
            if (!doorObj) return;

            if (doorObj.isLocked) {
                playerPos.x -= (x === 0 ? -1 : x === 6 ? 1 : 0);
                playerPos.y -= (y === 0 ? -1 : y === 6 ? 1 : 0);
                updatePlayerRender();
                alert("The door is locked! Stand adjacent facing the door and press Space/E to pick or break it.");
                return;
            }

            if (Math.random() < 0.25) {
                triggerDoorChallenge();
            }

            const entryDirection = OPPOSITE_WALL[wallKey];
            loadRoom(doorObj.targetRoom, entryDirection);
        }

        function interact() {
            const offset = DIR_OFFSETS[playerFacing];
            const targetX = playerPos.x + offset.x;
            const targetY = playerPos.y + offset.y;

            if (targetX < 0 || targetX >= GRID_SIZE || targetY < 0 || targetY >= GRID_SIZE) return;

            const char = activeLayout[targetY][targetX];

            if (char === DOOR_CHAR) {
                const doorObj = doorData[playerFacing];
                if (doorObj && doorObj.isLocked) {
                    const choice = confirm("Press OK to Pick Lock, or Cancel to Break Down Door.");
                    const onUnlocked = (success) => {
                        if (success) renderBoard();
                    };

                    if (choice) {
                        pickLockDoor(doorObj, onUnlocked);
                    } else {
                        breakDownDoor(doorObj, onUnlocked);
                    }
                    return;
                }
            }

            if (['(', '<', '*', '?', '&', BOSS_CHAR, FOUNTAIN_CHAR, WATER_CHAR, TRAP_CHAR].includes(char)) {
                const roomItems = currentFloorRooms[currentRoomIndex].items;
                const itemData = roomItems[`${targetX},${targetY}`];

                if (char === '(') {
                    activeLayout[targetY][targetX] = ')';
                    if (itemData) itemData.char = ')';
                    playerScore += 50;
                    uiScore.innerText = playerScore;
                    renderBoard();
                } else if (char === '<' || char === '*') {
                    activeLayout[targetY][targetX] = ' ';
                    if (itemData) itemData.state = 'DESTROYED';
                    playerScore += 20;
                    uiScore.innerText = playerScore;
                    renderBoard();
                } else if (char === TRAP_CHAR) {
                    activeLayout[targetY][targetX] = ' ';
                    if (itemData) itemData.state = 'DESTROYED';
                    playerScore += 15;
                    uiScore.innerText = playerScore;
                    alert("Trap disarmed!");
                    renderBoard();
                } else if (char === '?') {
                    triggerChallenge('D', itemData, () => renderBoard());
                } else if (char === '&') {
                    triggerChallenge('G', itemData, () => renderBoard());
                } else if (char === BOSS_CHAR) {
                    triggerChallenge('U', itemData, () => renderBoard());
                } else if (char === FOUNTAIN_CHAR) {
                    triggerChallenge('F', itemData, () => renderBoard());
                } else if (char === WATER_CHAR) {
                    const parent = findAssociatedFountain(targetX, targetY);
                    if (parent) {
                        triggerChallenge('F', parent.data, () => renderBoard());
                    }
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':    case 'w': case 'W': movePlayer(0, -1, 'NORTH'); break;
                case 'ArrowDown':  case 's': case 'S': movePlayer(0, 1, 'SOUTH');  break;
                case 'ArrowLeft':  case 'a': case 'A': movePlayer(-1, 0, 'WEST');  break;
                case 'ArrowRight': case 'd': case 'D': movePlayer(1, 0, 'EAST');  break;
                case ' ':          case 'e': case 'E': interact();                break;
            }
        });

        generateFloorData();
        loadRoom(0);
    </script>
</body>
</html>
