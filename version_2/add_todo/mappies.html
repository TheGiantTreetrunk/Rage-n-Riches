<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7x7 Isometric Dungeon - Extended Palette</title>
    <style>
        @font-face {
            font-family: 'DungeonFont';
            src: url('../font/test.ttf') format('truetype');
        }

        :root {
            --grid-size: 7;
            --cell-size: 44px;
            --grid-gap: 2px;
            --font-size: 38px;

            --floor-offset-y: 6px;  
            --floor-offset-x: 0px;  
            
            --player-offset-y: -10px; 
            --item-offset-y: -8px;
            --door-offset-y: -6px;
        }

        * { box-sizing: border-box; }

        body {
            background-color: #0b0c10;
            color: #66fcf1;
            font-family: 'DungeonFont', monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #hud {
            display: flex;
            gap: 24px;
            margin-bottom: 10px;
            font-family: system-ui, sans-serif;
            font-size: 1.1rem;
            color: #45a29e;
        }

        #instructions {
            margin-bottom: 15px;
            font-family: system-ui, sans-serif;
            font-size: 0.9rem;
            color: #c5c6c7;
            text-align: center;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 65vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        #game-board {
            position: relative;
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: var(--grid-gap);
            transform-style: preserve-3d;
            transform: rotateX(60deg) rotateZ(-45deg);
            background-color: transparent;
        }

        .tile {
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .tile-glyph {
            display: inline-block;
            font-size: var(--font-size);
            color: #45a29e;
            user-select: none;
            line-height: 1;
            text-shadow: 0 0 6px rgba(69, 162, 158, 0.4);
            transform: translate(var(--floor-offset-x), var(--floor-offset-y));
        }

        .tile-wall {
            color: #2b3a4a;
            text-shadow: none;
        }

        .tile-wall-item {
            color: #a3c1ad;
            text-shadow: 0 0 6px rgba(163, 193, 173, 0.5);
        }

        .tile-cracked {
            color: #2d545e;
            text-shadow: 0 0 4px rgba(45, 84, 94, 0.5);
        }

        .item-node, .door-node {
            position: absolute;
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        .item-text {
            display: flex;
            justify-content: center;
            align-items: center;
            width: var(--cell-size);
            height: var(--cell-size);
            font-size: var(--font-size);
            line-height: 1;
            user-select: none;
            transform: rotateZ(45deg) rotateX(-60deg) translateY(var(--item-offset-y));
        }

        .door-text {
            display: flex;
            justify-content: center;
            align-items: center;
            width: var(--cell-size);
            height: var(--cell-size);
            font-size: calc(var(--font-size) * 0.9);
            color: #e0a96d;
            text-shadow: 0 0 8px rgba(224, 169, 109, 0.8);
            line-height: 1;
            user-select: none;
        }

        .door-locked {
            color: #e63946;
            text-shadow: 0 0 10px rgba(230, 57, 70, 0.9);
        }

        .door-north, .door-south {
            transform: rotateZ(45deg) rotateX(-60deg) skewY(-26.5deg) translateY(var(--door-offset-y));
        }

        .door-west, .door-east {
            transform: rotateZ(45deg) rotateX(-60deg) skewY(26.5deg) translateY(var(--door-offset-y));
        }

        /* Item & Feature Palette Styles */
        .item-chest          { color: #d4a373; text-shadow: 0 0 8px rgba(212, 163, 115, 0.6); }
        .item-vase           { color: #e76f51; text-shadow: 0 0 8px rgba(231, 111, 81, 0.6); }
        .item-torch          { color: #f4a261; text-shadow: 0 0 10px rgba(244, 162, 97, 0.9); }
        .item-rock           { color: #8d99ae; text-shadow: 0 0 6px rgba(141, 153, 174, 0.5); }
        .item-demon          { color: #d62828; text-shadow: 0 0 12px rgba(214, 40, 40, 0.9); }
        .item-ghost          { color: #a8dede; text-shadow: 0 0 12px rgba(168, 222, 222, 0.9); }
        .item-boss           { color: #9d4edd; text-shadow: 0 0 16px rgba(157, 78, 221, 1.0); font-weight: bold; }
        .item-merchant       { color: #e9c46a; text-shadow: 0 0 12px rgba(233, 196, 106, 0.9); font-weight: bold; }
        
        .item-fountain       { color: #00b4d8; text-shadow: 0 0 12px rgba(0, 180, 216, 0.9); }
        .item-fountain-used  { color: #4a5568; text-shadow: none; opacity: 0.6; }
        .item-water          { color: #0077b6; text-shadow: 0 0 8px rgba(0, 119, 182, 0.7); }
        .item-water-used     { color: #3a506b; text-shadow: none; opacity: 0.5; }
        
        .item-grass          { color: #52b788; text-shadow: 0 0 6px rgba(82, 183, 136, 0.6); }
        .item-trap           { color: #ff4d6d; text-shadow: 0 0 10px rgba(255, 77, 109, 0.8); }

        /* Extended Furniture & Elements */
        .item-bookshelf      { color: #8b5a2b; text-shadow: 0 0 6px rgba(139, 90, 43, 0.6); }
        .item-wardrobe       { color: #6e473b; text-shadow: 0 0 6px rgba(110, 71, 59, 0.6); }
        .item-knocked        { color: #5c4033; opacity: 0.8; }
        .item-bellpost       { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.8); }
        .item-fireplace      { color: #ff5500; text-shadow: 0 0 14px rgba(255, 85, 0, 0.9); }
        .item-dresser        { color: #a0522d; text-shadow: 0 0 6px rgba(160, 82, 45, 0.6); }
        .item-table-vase     { color: #e9c46a; text-shadow: 0 0 8px rgba(233, 196, 106, 0.7); }

        #player {
            position: absolute;
            width: var(--cell-size);
            height: var(--cell-size);
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transition: transform 0.12s ease-out;
            transform-style: preserve-3d;
            z-index: 10;
        }

        .player-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: rotateZ(45deg) rotateX(-60deg) translateY(var(--player-offset-y));
        }

        .player-text {
            font-size: calc(var(--font-size) * 1.1);
            color: #ffe600;
            text-shadow: 0 0 10px rgba(255, 230, 0, 0.8);
            line-height: 1;
            user-select: none;
        }

        .facing-indicator {
            display: none;
            font-size: 14px;
            color: #66fcf1;
            text-shadow: 0 0 6px rgba(102, 252, 241, 0.9);
            font-family: system-ui, sans-serif;
            font-weight: bold;
            margin-top: -6px;
            user-select: none;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div>Floor: <span id="ui-floor">1</span></div>
        <div>Room: <span id="ui-room">1 / 6</span></div>
        <div>Score: <span id="ui-score">0</span></div>
        <div>Facing: <span id="ui-facing">SOUTH</span></div>
    </div>
    <div id="instructions">
        Move: <b>W, A, S, D / Arrows</b> | Interact / Search / Knock: <b>Space / E</b>
    </div>
    <div id="viewport">
        <div id="game-board"></div>
    </div>

    <script>
        const GRID_SIZE = 7;
        const CELL_SIZE = 44;
        const GRID_GAP = 2; 
        const STEP = CELL_SIZE + GRID_GAP; 
        const TOTAL_ROOMS = 6;

        const board = document.getElementById('game-board');
        const uiFloor = document.getElementById('ui-floor');
        const uiRoom = document.getElementById('ui-room');
        const uiScore = document.getElementById('ui-score');
        const uiFacing = document.getElementById('ui-facing');

        // Character Mappings
        const TORCH_CHAR = 'Z';
        const DOOR_CHAR = ':';
        const FOUNTAIN_CHAR = 'F';
        const WATER_CHAR = '~';
        const GRASS_CHAR = '"';
        const TRAP_CHAR = '^';
        const BOSS_CHAR = 'U';
        const MERCHANT_CHAR = 'm';

        // Floor Cracks
        const CRUSH_FLOOR_CHAR = 'O';

        // Furniture & Decoration
        const BOOKSHELF_CHAR = 'I';
        const BOOKSHELF_KNOCKED_CHAR = 'i';
        const WARDROBE_CHAR = 'J';
        const WARDROBE_KNOCKED_CHAR = 'j';
        const BELLPOST_CHAR = 'P';
        const FIREPLACE_CHAR = 'Q';
        const CLOSED_DRESSER_CHAR = 'V';
        const OPENED_DRESSER_CHAR = 'W';
        const VASE_TABLE_CHAR = 'X';
        const VASE_TABLE_KNOCKED_CHAR = 'Y';

        // Wall Items
        const SHIELD_WALL_CHAR = 'e';
        const WINDOW_WALL_CHAR = 'f';
        const BANNER_WALL_CHAR = 'h';

        let currentFloorNum = 1;
        let currentRoomIndex = 0;
        let playerScore = 0;
        let playerPos = { x: 3, y: 3 };
        let playerFacing = 'SOUTH';
        let playerElement = null;
        let facingIndicatorElement = null;

        // Merchant Cooldown Tracker (Floors remaining before merchant can spawn again)
        let merchantCooldown = 0;

        let currentFloorRooms = [];
        let activeLayout = [];
        let itemElements = {};
        let doorData = {};
        let pathTiles = new Set();

        const WALL_DIRS = ['NORTH', 'EAST', 'SOUTH', 'WEST'];
        const OPPOSITE_WALL = {
            'NORTH': 'SOUTH',
            'SOUTH': 'NORTH',
            'EAST':  'WEST',
            'WEST':  'EAST'
        };

        const DIR_OFFSETS = {
            'NORTH': { x: 0, y: -1 },
            'SOUTH': { x: 0, y: 1 },
            'WEST':  { x: -1, y: 0 },
            'EAST':  { x: 1, y: 0 }
        };

        const FACING_ARROWS = {
            'NORTH': '▲',
            'SOUTH': '▼',
            'WEST':  '◄',
            'EAST':  '►'
        };

        const DOOR_COORDS = {
            'NORTH': { x: 3, y: 0 },
            'SOUTH': { x: 3, y: 6 },
            'WEST':  { x: 0, y: 3 },
            'EAST':  { x: 6, y: 3 }
        };

        const ENTRY_SPAWNS = {
            'NORTH': { x: 3, y: 1 },
            'SOUTH': { x: 3, y: 5 },
            'WEST':  { x: 1, y: 3 },
            'EAST':  { x: 5, y: 3 }
        };

        function playBellChime() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 1.2);

                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 1.2);
            } catch(e) {}
        }

        function findAssociatedFountain(x, y) {
            const roomItems = currentFloorRooms[currentRoomIndex].items;
            const item = roomItems[`${x},${y}`];
            if (item && item.fountainKey && roomItems[item.fountainKey]) {
                return { key: item.fountainKey, data: roomItems[item.fountainKey] };
            }
            return null;
        }

        function pickLockDoor(doorObj, onComplete) {
            alert("Attempting to pick the lock!");
            doorObj.isLocked = false;
            if (onComplete) onComplete(true);
        }

        function breakDownDoor(doorObj, onComplete) {
            alert("Breaking down the door!");
            doorObj.isLocked = false;
            if (onComplete) onComplete(true);
        }

        function interactWithMerchant(x, y) {
            const options = "Greetings traveler! What would you like to buy?\n\n" +
                            "1 - Health Potion (+50 Score) [Cost: 20 Score]\n" +
                            "2 - Master Lockpick (Unlocks next door) [Cost: 30 Score]\n" +
                            "3 - Decline / Leave";

            const choice = prompt(options, "1");

            if (choice === "1") {
                if (playerScore >= 20) {
                    playerScore = playerScore - 20 + 50; // Spend 20, gain 50 worth
                    uiScore.innerText = playerScore;
                    alert("You bought a Health Potion!");
                } else {
                    alert("Not enough score points!");
                }
            } else if (choice === "2") {
                if (playerScore >= 30) {
                    playerScore -= 30;
                    uiScore.innerText = playerScore;
                    alert("You purchased a Master Lockpick!");
                } else {
                    alert("Not enough score points!");
                }
            } else {
                alert("The merchant nods and prepares to pack up.");
            }

            // Remove Merchant from room state and clear cell
            alert("The merchant packs up their wares and vanishes into the dark!");
            const roomItems = currentFloorRooms[currentRoomIndex].items;
            delete roomItems[`${x},${y}`];
            activeLayout[y][x] = ' ';
            renderBoard();
        }

        function triggerChallenge(entityType, itemData, onComplete) {
            if (entityType === 'D') {
                alert("A Demon approaches! Triggering Combat Challenge.");
                if (onComplete) onComplete(true);
            } else if (entityType === 'G') {
                alert("A Ghost appears! Triggering Puzzle Challenge.");
                if (onComplete) onComplete(true);
            } else if (entityType === 'F') {
                if (itemData && itemData.isUsed) {
                    alert("The fountain water is still and depleted.");
                    return;
                }

                const acceptChallenge = confirm("You approach the pool of glowing water in front of the Fountain.\n\nAccept the Sacred Challenge for a blessing?");
                if (acceptChallenge) {
                    alert("Challenge Passed! You drink from the glowing waters and gain +100 points.");
                    playerScore += 100;
                    uiScore.innerText = playerScore;

                    if (itemData) {
                        itemData.isUsed = true;
                    }
                    if (onComplete) onComplete(true);
                }
            } else if (entityType === 'U') {
                alert("BOSS BATTLE INITIATED!\n\nYou challenge the Grave Lord in mortal combat!");
                alert("VICTORY! You defeated the Boss and earned +500 points!");
                
                playerScore += 500;
                uiScore.innerText = playerScore;

                if (itemData) itemData.state = 'DESTROYED';
                currentFloorRooms[5].bossDefeated = true;

                alert("The dungeon shifts and reshapes around you... Descending to Floor " + (currentFloorNum + 1) + "!");
                
                currentFloorNum++;
                uiFloor.innerText = currentFloorNum;
                generateFloorData();
                loadRoom(0);
            }
        }

        function triggerDoorChallenge() {
            const isFight = Math.random() < 0.5;
            if (isFight) {
                alert("Ambush! Enemies attack as you open the door!");
            } else {
                alert("Trap triggered! The room is flooding with water!");
            }
        }

        function handleGrassStep(x, y) {
            if (Math.random() < 0.15) {
                const eventRoll = Math.random();

                if (eventRoll < 0.45) {
                    const entityType = Math.random() < 0.5 ? 'D' : 'G';
                    const name = entityType === 'D' ? 'Demon' : 'Ghost';
                    alert(`AMBUSH! A ${name} leaps out from the tall grass!`);
                    triggerChallenge(entityType, null, () => {
                        clearGrassTile(x, y);
                    });
                } else if (eventRoll < 0.80) {
                    alert("SNAP! You stepped on a hidden spike trap concealed in the grass! (-10 Score)");
                    playerScore = Math.max(0, playerScore - 10);
                    uiScore.innerText = playerScore;
                    
                    const roomItems = currentFloorRooms[currentRoomIndex].items;
                    roomItems[`${x},${y}`] = { char: TRAP_CHAR, state: 'TRAP' };
                    activeLayout[y][x] = TRAP_CHAR;
                    renderBoard();
                } else {
                    alert("You rustle through the grass and uncover a hidden pouch of gold! (+25 Score)");
                    playerScore += 25;
                    uiScore.innerText = playerScore;
                    clearGrassTile(x, y);
                }
            }
        }

        function clearGrassTile(x, y) {
            const roomItems = currentFloorRooms[currentRoomIndex].items;
            delete roomItems[`${x},${y}`];
            activeLayout[y][x] = ' ';
            renderBoard();
        }

        function generateFloorData() {
            currentFloorRooms = [];

            // Update Merchant Cooldown logic
            let spawnMerchantThisFloor = false;
            if (merchantCooldown > 0) {
                merchantCooldown--;
            } else {
                // 60% chance to spawn merchant when off cooldown
                if (Math.random() < 0.60) {
                    spawnMerchantThisFloor = true;
                }
            }

            // Random room selected for merchant (Rooms 2 through 5)
            const merchantRoomIndex = spawnMerchantThisFloor ? Math.floor(Math.random() * 4) + 1 : -1;

            // Room 1: Starting Room
            const firstExit = WALL_DIRS[Math.floor(Math.random() * WALL_DIRS.length)];
            const r1 = {
                index: 0,
                entryWall: null,
                forwardWall: firstExit,
                doors: {
                    [firstExit]: { type: 'FORWARD', isLocked: false, targetRoom: 1 }
                },
                items: {},
                wallDecorations: generateWallDecorations(null, firstExit)
            };
            r1.pathTiles = generatePathsForRoom(r1.doors);
            currentFloorRooms.push(r1);

            // Rooms 2 to 5
            for (let i = 1; i < TOTAL_ROOMS - 1; i++) {
                const prevRoom = currentFloorRooms[i - 1];
                const entryWall = OPPOSITE_WALL[prevRoom.forwardWall];
                
                const availableWalls = WALL_DIRS.filter(w => w !== entryWall);
                const forwardWall = availableWalls[Math.floor(Math.random() * availableWalls.length)];

                const isLocked = Math.random() < 0.35;

                const roomObj = {
                    index: i,
                    entryWall: entryWall,
                    forwardWall: forwardWall,
                    doors: {
                        [entryWall]: { type: 'BACKWARD', isLocked: false, targetRoom: i - 1 },
                        [forwardWall]: { type: 'FORWARD', isLocked: isLocked, targetRoom: i + 1 }
                    },
                    items: {},
                    wallDecorations: generateWallDecorations(entryWall, forwardWall)
                };

                const hasMerchant = (i === merchantRoomIndex);
                roomObj.items = generateRoomItems(roomObj, hasMerchant);
                roomObj.pathTiles = generatePathsForRoom(roomObj.doors);
                currentFloorRooms.push(roomObj);
            }

            // Room 6: Boss Arena
            const prevRoom = currentFloorRooms[4];
            const entryWall = OPPOSITE_WALL[prevRoom.forwardWall];

            const bossRoomObj = {
                index: 5,
                entryWall: entryWall,
                forwardWall: null,
                bossDefeated: false,
                doors: {
                    [entryWall]: { type: 'BACKWARD', isLocked: false, targetRoom: 4 }
                },
                wallDecorations: generateWallDecorations(entryWall, null),
                items: {
                    '1,1': { char: TORCH_CHAR, state: 'INTACT' },
                    '5,1': { char: TORCH_CHAR, state: 'INTACT' },
                    '1,5': { char: TORCH_CHAR, state: 'INTACT' },
                    '5,5': { char: TORCH_CHAR, state: 'INTACT' },
                    '3,3': { char: BOSS_CHAR, state: 'ACTIVE' }
                }
            };
            bossRoomObj.pathTiles = generatePathsForRoom(bossRoomObj.doors);
            currentFloorRooms.push(bossRoomObj);

            if (spawnMerchantThisFloor) {
                // Set cooldown: 1 or 2 floor delay before spawn eligible again
                merchantCooldown = Math.random() < 0.5 ? 1 : 2;
            }
        }

        function generateWallDecorations(entryWall, forwardWall) {
            const wallItems = {};
            const availableDecorations = [SHIELD_WALL_CHAR, WINDOW_WALL_CHAR, BANNER_WALL_CHAR];

            const activeWalls = new Set();
            if (entryWall) activeWalls.add(entryWall);
            if (forwardWall) activeWalls.add(forwardWall);

            for (const wall of WALL_DIRS) {
                if (activeWalls.has(wall)) continue;

                if (Math.random() < 0.6) {
                    const decChar = availableDecorations[Math.floor(Math.random() * availableDecorations.length)];
                    let coord = { x: 3, y: 3 };
                    if (wall === 'NORTH') coord = { x: 3, y: 0 };
                    else if (wall === 'SOUTH') coord = { x: 3, y: 6 };
                    else if (wall === 'WEST') coord = { x: 0, y: 3 };
                    else if (wall === 'EAST') coord = { x: 6, y: 3 };

                    wallItems[`${coord.x},${coord.y}`] = decChar;
                }
            }
            return wallItems;
        }

        function generatePathsForRoom(doors) {
            const pathSet = new Set();
            if (!doors || Math.random() < 0.3) return pathSet;

            const activeDoorWalls = Object.keys(doors);
            if (activeDoorWalls.length < 2) return pathSet;

            const startPt = ENTRY_SPAWNS[activeDoorWalls[0]];
            const endPt = ENTRY_SPAWNS[activeDoorWalls[1]];

            let currX = startPt.x;
            let currY = startPt.y;

            pathSet.add(`${currX},${currY}`);

            while (currX !== endPt.x || currY !== endPt.y) {
                if (Math.random() < 0.5 && currX !== endPt.x) {
                    currX += (endPt.x > currX ? 1 : -1);
                } else if (currY !== endPt.y) {
                    currY += (endPt.y > currY ? 1 : -1);
                } else {
                    currX += (endPt.x > currX ? 1 : -1);
                }
                pathSet.add(`${currX},${currY}`);
            }

            return pathSet;
        }

        function generateRoomItems(roomObj, hasMerchant = false) {
            let items = {};
            let isValidLayout = false;
            let attempts = 0;

            const doorClearanceTiles = new Set([
                '3,1', '2,1', '4,1',
                '3,5', '2,5', '4,5',
                '1,3', '1,2', '1,4',
                '5,3', '5,2', '5,4'
            ]);

            while (!isValidLayout && attempts < 50) {
                attempts++;
                items = {};

                // Place Merchant if assigned to this room
                if (hasMerchant) {
                    let mx = Math.floor(Math.random() * 3) + 2;
                    let my = Math.floor(Math.random() * 3) + 2;
                    let key = `${mx},${my}`;
                    if (!doorClearanceTiles.has(key)) {
                        items[key] = { char: MERCHANT_CHAR, state: 'ACTIVE' };
                    }
                }

                // Fountain structure
                if (Math.random() < 0.5) {
                    const corners = [
                        { fx: 1, fy: 1, w: [{x:2, y:1}, {x:1, y:2}] },
                        { fx: 5, fy: 1, w: [{x:4, y:1}, {x:5, y:2}] },
                        { fx: 1, fy: 5, w: [{x:1, y:4}, {x:2, y:5}] },
                        { fx: 5, fy: 5, w: [{x:5, y:4}, {x:4, y:5}] }
                    ];
                    const chosenCorner = corners[Math.floor(Math.random() * corners.length)];
                    const fKey = `${chosenCorner.fx},${chosenCorner.fy}`;

                    if (!items[fKey]) {
                        items[fKey] = { char: FOUNTAIN_CHAR, state: 'SOLID', isUsed: false };

                        for (const wt of chosenCorner.w) {
                            const wKey = `${wt.x},${wt.y}`;
                            if (!items[wKey]) items[wKey] = { char: WATER_CHAR, state: 'SOLID', fountainKey: fKey };
                        }
                    }
                }

                // Traps
                if (Math.random() < 0.4) {
                    const isHorizontal = Math.random() < 0.5;
                    if (isHorizontal) {
                        const trapY = Math.random() < 0.5 ? 2 : 4;
                        for (let tx = 1; tx <= 5; tx++) {
                            const key = `${tx},${trapY}`;
                            if (!items[key]) {
                                items[key] = { char: TRAP_CHAR, state: 'TRAP' };
                            }
                        }
                    } else {
                        const trapX = Math.random() < 0.5 ? 2 : 4;
                        for (let ty = 1; ty <= 5; ty++) {
                            const key = `${trapX},${ty}`;
                            if (!items[key]) {
                                items[key] = { char: TRAP_CHAR, state: 'TRAP' };
                            }
                        }
                    }
                }

                // Grass Density
                const grassTypeRoll = Math.random();
                let grassCount = grassTypeRoll < 0.25 ? Math.floor(Math.random() * 6) + 12 : (grassTypeRoll < 0.75 ? Math.floor(Math.random() * 5) + 6 : Math.floor(Math.random() * 3) + 2);

                let gx = Math.floor(Math.random() * 5) + 1;
                let gy = Math.floor(Math.random() * 5) + 1;

                for (let g = 0; g < grassCount; g++) {
                    const key = `${gx},${gy}`;
                    if (!doorClearanceTiles.has(key) && !items[key]) {
                        items[key] = { char: GRASS_CHAR, state: 'WALKABLE' };
                    }
                    gx = Math.min(5, Math.max(1, gx + (Math.floor(Math.random() * 3) - 1)));
                    gy = Math.min(5, Math.max(1, gy + (Math.floor(Math.random() * 3) - 1)));
                }

                // Extended Furniture & Deco Pool
                const possibleItems = [
                    '(', '<', '*', TORCH_CHAR, 
                    BOOKSHELF_CHAR, WARDROBE_CHAR, BELLPOST_CHAR, 
                    FIREPLACE_CHAR, CLOSED_DRESSER_CHAR, VASE_TABLE_CHAR
                ];
                const itemCount = Math.floor(Math.random() * 4) + 2;

                for (let i = 0; i < itemCount; i++) {
                    const rx = Math.floor(Math.random() * 5) + 1;
                    const ry = Math.floor(Math.random() * 5) + 1;
                    const key = `${rx},${ry}`;

                    if (doorClearanceTiles.has(key) || items[key]) continue;

                    const char = possibleItems[Math.floor(Math.random() * possibleItems.length)];
                    items[key] = { char: char, state: 'INTACT' };
                }

                // Entities (Demon / Ghost)
                if (Math.random() < 0.5) {
                    const cx = Math.floor(Math.random() * 3) + 2;
                    const cy = Math.floor(Math.random() * 3) + 2;
                    const key = `${cx},${cy}`;

                    if (!doorClearanceTiles.has(key) && !items[key]) {
                        const entityChar = Math.random() < 0.5 ? '?' : '&';
                        items[key] = { char: entityChar, state: 'ACTIVE' };
                    }
                }

                isValidLayout = validateRoomPathways(items, roomObj);
            }

            return items;
        }

        function validateRoomPathways(items, roomObj) {
            if (!roomObj || !roomObj.doors) return true;

            const activeSpawnPoints = [];
            for (const wall of Object.keys(roomObj.doors)) {
                activeSpawnPoints.push(ENTRY_SPAWNS[wall]);
            }

            if (activeSpawnPoints.length < 2) return true;

            const start = activeSpawnPoints[0];
            const queue = [start];
            const visited = new Set([`${start.x},${start.y}`]);

            while (queue.length > 0) {
                const curr = queue.shift();

                const neighbors = [
                    { x: curr.x, y: curr.y - 1 },
                    { x: curr.x, y: curr.y + 1 },
                    { x: curr.x - 1, y: curr.y },
                    { x: curr.x + 1, y: curr.y }
                ];

                for (const n of neighbors) {
                    if (n.x < 1 || n.x > 5 || n.y < 1 || n.y > 5) continue;
                    
                    const key = `${n.x},${n.y}`;
                    if (visited.has(key)) continue;

                    const item = items[key];
                    if (item && (item.state === 'SOLID' || item.state === 'INTACT' || item.state === 'ACTIVE' || item.char === FOUNTAIN_CHAR || item.char === MERCHANT_CHAR)) continue;

                    visited.add(key);
                    queue.push(n);
                }
            }

            return activeSpawnPoints.every(pt => visited.has(`${pt.x},${pt.y}`));
        }

        function loadRoom(roomIdx, entryDirection = null) {
            currentRoomIndex = roomIdx;
            uiRoom.innerText = `${currentRoomIndex + 1} / ${TOTAL_ROOMS}`;

            const roomData = currentFloorRooms[roomIdx];
            doorData = roomData.doors;
            pathTiles = roomData.pathTiles || new Set();

            activeLayout = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(' '));

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (r === 0 || r === GRID_SIZE - 1 || c === 0 || c === GRID_SIZE - 1) {
                        const wallDec = roomData.wallDecorations[`${c},${r}`];
                        activeLayout[r][c] = wallDec ? wallDec : 'W';
                    }
                }
            }

            for (const [wall, dInfo] of Object.entries(doorData)) {
                const coord = DOOR_COORDS[wall];
                activeLayout[coord.y][coord.x] = DOOR_CHAR;
            }

            for (const [posKey, item] of Object.entries(roomData.items)) {
                const [ix, iy] = posKey.split(',').map(Number);
                if (item.state !== 'DESTROYED') {
                    activeLayout[iy][ix] = item.char;
                }
            }

            if (entryDirection && ENTRY_SPAWNS[entryDirection]) {
                playerPos = { ...ENTRY_SPAWNS[entryDirection] };
                playerFacing = OPPOSITE_WALL[entryDirection];
            } else {
                playerPos = { x: 3, y: 3 };
                playerFacing = 'SOUTH';
            }

            renderBoard();
        }

        function renderBoard() {
            board.innerHTML = '';
            itemElements = {};

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const tile = document.createElement('div');
                    tile.classList.add('tile');
                    
                    const glyph = document.createElement('span');
                    glyph.classList.add('tile-glyph');

                    const isWallBoundary = (r === 0 || r === GRID_SIZE - 1 || c === 0 || c === GRID_SIZE - 1);
                    const charAt = activeLayout[r][c];

                    if (isWallBoundary) {
                        if ([SHIELD_WALL_CHAR, WINDOW_WALL_CHAR, BANNER_WALL_CHAR].includes(charAt)) {
                            glyph.innerText = charAt;
                            glyph.classList.add('tile-wall-item');
                        } else {
                            glyph.innerText = ' ';
                            glyph.classList.add('tile-wall');
                        }
                    } else {
                        if (pathTiles.has(`${c},${r}`)) {
                            glyph.innerText = CRUSH_FLOOR_CHAR;
                            glyph.classList.add('tile-cracked');
                        } else {
                            glyph.innerText = '#';
                        }
                    }
                    
                    tile.appendChild(glyph);
                    board.appendChild(tile);
                }
            }

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const char = activeLayout[r][c];

                    if (char === DOOR_CHAR) {
                        spawnDoor(c, r);
                    } else if (char !== ' ' && char !== 'W' && ![SHIELD_WALL_CHAR, WINDOW_WALL_CHAR, BANNER_WALL_CHAR].includes(char)) {
                        spawnItem(c, r, char);
                    }
                }
            }

            spawnPlayer();
        }

        function spawnDoor(x, y) {
            const doorNode = document.createElement('div');
            doorNode.classList.add('door-node');
            doorNode.style.transform = `translate3d(${x * STEP}px, ${y * STEP}px, 0px)`;

            const doorText = document.createElement('div');
            doorText.classList.add('door-text');

            let wallKey = null;
            if (y === 0) { doorText.classList.add('door-north'); wallKey = 'NORTH'; }
            else if (y === GRID_SIZE - 1) { doorText.classList.add('door-south'); wallKey = 'SOUTH'; }
            else if (x === 0) { doorText.classList.add('door-west'); wallKey = 'WEST'; }
            else if (x === GRID_SIZE - 1) { doorText.classList.add('door-east'); wallKey = 'EAST'; }

            const dObj = doorData[wallKey];
            if (dObj && dObj.isLocked) {
                doorText.classList.add('door-locked');
            }

            doorText.innerText = DOOR_CHAR;
            doorNode.appendChild(doorText);
            board.appendChild(doorNode);
        }

        function spawnItem(x, y, char) {
            const itemNode = document.createElement('div');
            itemNode.classList.add('item-node');
            itemNode.style.transform = `translate3d(${x * STEP}px, ${y * STEP}px, 0px)`;

            const itemText = document.createElement('div');
            itemText.classList.add('item-text');
            itemText.innerText = char;

            const roomItems = currentFloorRooms[currentRoomIndex].items;
            const itemData = roomItems[`${x},${y}`];

            if (char === '(' || char === ')') itemText.classList.add('item-chest');
            else if (char === '<') itemText.classList.add('item-vase');
            else if (char === TORCH_CHAR) itemText.classList.add('item-torch');
            else if (char === '*') itemText.classList.add('item-rock');
            else if (char === '?') itemText.classList.add('item-demon');
            else if (char === '&') itemText.classList.add('item-ghost');
            else if (char === BOSS_CHAR) itemText.classList.add('item-boss');
            else if (char === MERCHANT_CHAR) itemText.classList.add('item-merchant');
            else if (char === BOOKSHELF_CHAR) itemText.classList.add('item-bookshelf');
            else if (char === BOOKSHELF_KNOCKED_CHAR) itemText.classList.add('item-bookshelf', 'item-knocked');
            else if (char === WARDROBE_CHAR) itemText.classList.add('item-wardrobe');
            else if (char === WARDROBE_KNOCKED_CHAR) itemText.classList.add('item-wardrobe', 'item-knocked');
            else if (char === BELLPOST_CHAR) itemText.classList.add('item-bellpost');
            else if (char === FIREPLACE_CHAR) itemText.classList.add('item-fireplace');
            else if (char === CLOSED_DRESSER_CHAR || char === OPENED_DRESSER_CHAR) itemText.classList.add('item-dresser');
            else if (char === VASE_TABLE_CHAR) itemText.classList.add('item-table-vase');
            else if (char === VASE_TABLE_KNOCKED_CHAR) itemText.classList.add('item-table-vase', 'item-knocked');
            else if (char === FOUNTAIN_CHAR) {
                if (itemData && itemData.isUsed) {
                    itemText.classList.add('item-fountain-used');
                } else {
                    itemText.classList.add('item-fountain');
                }
            }
            else if (char === WATER_CHAR) {
                const parentFountain = findAssociatedFountain(x, y);
                if (parentFountain && parentFountain.data.isUsed) {
                    itemText.classList.add('item-water-used');
                } else {
                    itemText.classList.add('item-water');
                }
            }
            else if (char === GRASS_CHAR) itemText.classList.add('item-grass');
            else if (char === TRAP_CHAR) itemText.classList.add('item-trap');

            itemNode.appendChild(itemText);
            board.appendChild(itemNode);

            itemElements[`${x},${y}`] = itemText;
        }

        function spawnPlayer() {
            playerElement = document.createElement('div');
            playerElement.id = 'player';

            const wrapper = document.createElement('div');
            wrapper.classList.add('player-wrapper');

            const sprite = document.createElement('div');
            sprite.classList.add('player-text');
            sprite.innerText = '@';

            facingIndicatorElement = document.createElement('div');
            facingIndicatorElement.classList.add('facing-indicator');

            wrapper.appendChild(sprite);
            wrapper.appendChild(facingIndicatorElement);
            playerElement.appendChild(wrapper);
            board.appendChild(playerElement);

            updatePlayerRender();
        }

        function updatePlayerRender() {
            playerElement.style.transform = `translate3d(${playerPos.x * STEP}px, ${playerPos.y * STEP}px, 0px)`;
            facingIndicatorElement.innerText = FACING_ARROWS[playerFacing];
            uiFacing.innerText = playerFacing;
        }

        function isWalkable(x, y) {
            if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) return false;

            const char = activeLayout[y][x];
            if (char === 'W') return false;
            
            if ([SHIELD_WALL_CHAR, WINDOW_WALL_CHAR, BANNER_WALL_CHAR].includes(char)) return false;

            if ([
                '(', '<', '*', TORCH_CHAR, '?', '&', BOSS_CHAR, MERCHANT_CHAR, FOUNTAIN_CHAR, WATER_CHAR, TRAP_CHAR,
                BOOKSHELF_CHAR, WARDROBE_CHAR, BELLPOST_CHAR, FIREPLACE_CHAR, CLOSED_DRESSER_CHAR, VASE_TABLE_CHAR
            ].includes(char)) return false;

            return true;
        }

        function movePlayer(dx, dy, newFacing) {
            playerFacing = newFacing;

            const targetX = playerPos.x + dx;
            const targetY = playerPos.y + dy;

            if (isWalkable(targetX, targetY)) {
                playerPos.x = targetX;
                playerPos.y = targetY;

                const tileChar = activeLayout[targetY][targetX];

                if (tileChar === DOOR_CHAR) {
                    handleDoorStep(targetX, targetY);
                } else if (tileChar === GRASS_CHAR) {
                    handleGrassStep(targetX, targetY);
                }
            }

            updatePlayerRender();
        }

        function handleDoorStep(x, y) {
            let wallKey = null;
            if (y === 0) wallKey = 'NORTH';
            else if (y === GRID_SIZE - 1) wallKey = 'SOUTH';
            else if (x === 0) wallKey = 'WEST';
            else if (x === GRID_SIZE - 1) wallKey = 'EAST';

            const doorObj = doorData[wallKey];
            if (!doorObj) return;

            if (doorObj.isLocked) {
                playerPos.x -= (x === 0 ? -1 : x === 6 ? 1 : 0);
                playerPos.y -= (y === 0 ? -1 : y === 6 ? 1 : 0);
                updatePlayerRender();
                alert("The door is locked! Stand adjacent facing the door and press Space/E to pick or break it.");
                return;
            }

            if (Math.random() < 0.25) {
                triggerDoorChallenge();
            }

            const entryDirection = OPPOSITE_WALL[wallKey];
            loadRoom(doorObj.targetRoom, entryDirection);
        }

        function interact() {
            const offset = DIR_OFFSETS[playerFacing];
            const targetX = playerPos.x + offset.x;
            const targetY = playerPos.y + offset.y;

            if (targetX < 0 || targetX >= GRID_SIZE || targetY < 0 || targetY >= GRID_SIZE) return;

            const char = activeLayout[targetY][targetX];

            if (char === DOOR_CHAR) {
                const doorObj = doorData[playerFacing];
                if (doorObj && doorObj.isLocked) {
                    const choice = confirm("Press OK to Pick Lock, or Cancel to Break Down Door.");
                    const onUnlocked = (success) => {
                        if (success) renderBoard();
                    };

                    if (choice) {
                        pickLockDoor(doorObj, onUnlocked);
                    } else {
                        breakDownDoor(doorObj, onUnlocked);
                    }
                    return;
                }
            }

            if ([
                '(', '<', '*', '?', '&', BOSS_CHAR, MERCHANT_CHAR, FOUNTAIN_CHAR, WATER_CHAR, TRAP_CHAR,
                BOOKSHELF_CHAR, WARDROBE_CHAR, BELLPOST_CHAR, FIREPLACE_CHAR, CLOSED_DRESSER_CHAR, VASE_TABLE_CHAR
            ].includes(char)) {
                
                const roomItems = currentFloorRooms[currentRoomIndex].items;
                const itemData = roomItems[`${targetX},${targetY}`];

                if (char === MERCHANT_CHAR) {
                    interactWithMerchant(targetX, targetY);
                } else if (char === '(') {
                    activeLayout[targetY][targetX] = ')';
                    if (itemData) itemData.char = ')';
                    playerScore += 50;
                    uiScore.innerText = playerScore;
                    renderBoard();
                } else if (char === '<' || char === '*') {
                    activeLayout[targetY][targetX] = ' ';
                    if (itemData) itemData.state = 'DESTROYED';
                    playerScore += 20;
                    uiScore.innerText = playerScore;
                    renderBoard();
                } else if (char === BOOKSHELF_CHAR) {
                    activeLayout[targetY][targetX] = BOOKSHELF_KNOCKED_CHAR;
                    if (itemData) itemData.char = BOOKSHELF_KNOCKED_CHAR;
                    playerScore += 10;
                    uiScore.innerText = playerScore;
                    alert("You knocked over the bookshelf! Books spill everywhere.");
                    renderBoard();
                } else if (char === WARDROBE_CHAR) {
                    activeLayout[targetY][targetX] = WARDROBE_KNOCKED_CHAR;
                    if (itemData) itemData.char = WARDROBE_KNOCKED_CHAR;
                    playerScore += 15;
                    uiScore.innerText = playerScore;
                    alert("You pushed over the wardrobe with a heavy thud!");
                    renderBoard();
                } else if (char === BELLPOST_CHAR) {
                    playBellChime();
                    alert("DING! The bell post rings loudly through the dungeon corridor.");
                } else if (char === FIREPLACE_CHAR) {
                    alert("The hearth crackles with warm embers.");
                } else if (char === CLOSED_DRESSER_CHAR) {
                    activeLayout[targetY][targetX] = OPENED_DRESSER_CHAR;
                    if (itemData) itemData.char = OPENED_DRESSER_CHAR;
                    playerScore += 25;
                    uiScore.innerText = playerScore;
                    alert("You opened the dresser drawers and found some loot (+25 score)!");
                    renderBoard();
                } else if (char === VASE_TABLE_CHAR) {
                    activeLayout[targetY][targetX] = VASE_TABLE_KNOCKED_CHAR;
                    if (itemData) itemData.char = VASE_TABLE_KNOCKED_CHAR;
                    playerScore += 10;
                    uiScore.innerText = playerScore;
                    alert("Shatter! You knocked the vase off the table.");
                    renderBoard();
                } else if (char === TRAP_CHAR) {
                    activeLayout[targetY][targetX] = ' ';
                    if (itemData) itemData.state = 'DESTROYED';
                    playerScore += 15;
                    uiScore.innerText = playerScore;
                    alert("Trap disarmed!");
                    renderBoard();
                } else if (char === '?') {
                    triggerChallenge('D', itemData, () => renderBoard());
                } else if (char === '&') {
                    triggerChallenge('G', itemData, () => renderBoard());
                } else if (char === BOSS_CHAR) {
                    triggerChallenge('U', itemData, () => renderBoard());
                } else if (char === FOUNTAIN_CHAR) {
                    triggerChallenge('F', itemData, () => renderBoard());
                } else if (char === WATER_CHAR) {
                    const parent = findAssociatedFountain(targetX, targetY);
                    if (parent) {
                        triggerChallenge('F', parent.data, () => renderBoard());
                    }
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':    case 'w': case 'W': movePlayer(0, -1, 'NORTH'); break;
                case 'ArrowDown':  case 's': case 'S': movePlayer(0, 1, 'SOUTH');  break;
                case 'ArrowLeft':  case 'a': case 'A': movePlayer(-1, 0, 'WEST');  break;
                case 'ArrowRight': case 'd': case 'D': movePlayer(1, 0, 'EAST');  break;
                case ' ':          case 'e': case 'E': interact();                break;
            }
        });

        generateFloorData();
        loadRoom(0);
    </script>
</body>
</html>
