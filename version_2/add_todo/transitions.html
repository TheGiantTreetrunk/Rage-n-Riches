<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Terminal Module</title>
    <style>
        /* --- MODULE NAMESPACE: .ra- (Retro Arcade) --- */
        :root {
            --ra-pixel-color: #222222; /* Dark Gray Transition Blocks */
            --ra-bg-color: #000000;    /* Deep Black */
            --ra-text-primary: #ffffff; /* Stark White */
            --ra-text-secondary: #888888; /* Dim Gray */
        }

        /* 1. INITIAL SHAKE (No Flashing) */
        .ra-glitch-out {
            /* !important ensures it overrides existing project styles during transition */
            animation: ra-violent-shake 0.2s steps(3) infinite !important;
        }

        @keyframes ra-violent-shake {
            0% { transform: translate(0, 0); }
            15% { transform: translate(-10px, -6px); }
            35% { transform: translate(10px, 8px); }
            55% { transform: translate(-10px, 9px); }
            75% { transform: translate(8px, -10px); }
            95% { transform: translate(-4px, 6px); }
            100% { transform: translate(0, 0); }
        }

        /* 2. PIXEL GRID LAYER */
        #ra-pixel-canvas {
            position: fixed;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            grid-template-rows: repeat(20, 1fr);
            z-index: 9998;
            pointer-events: none;
        }

        .ra-pixel {
            background: var(--ra-pixel-color);
            transform: scale(0);
            transition: transform 0.2s steps(3);
        }

        .ra-show-pixels .ra-pixel {
            transform: scale(1.1);
        }

        /* 3. OVERLAY MODULE */
        #ra-overlay-module {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            background: var(--ra-bg-color);
            padding: 40px;
            color: var(--ra-text-primary);
            text-align: center;
            border: 2px solid var(--ra-text-primary);
            display: none;
            min-width: 320px;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 0 40px rgba(0,0,0,1);
        }

        /* 4. SCANLINES (Always on top for texture) */
        .ra-scanlines {
            position: fixed;
            inset: 0;
            background: linear-gradient(
                rgba(255, 255, 255, 0.03) 50%, 
                rgba(0, 0, 0, 0.1) 50%
            );
            background-size: 100% 4px;
            z-index: 10000;
            pointer-events: none;
        }

        /* UTILITY BUTTONS */
        .ra-btn {
            padding: 12px 24px;
            background: transparent;
            border: 1px solid var(--ra-text-primary);
            color: var(--ra-text-primary);
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .ra-btn:hover {
            background: var(--ra-text-primary);
            color: var(--ra-bg-color);
        }

        /* STYLES FOR YOUR EXISTING PAGE (FOR DEMO) */
        body {
            margin: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
    </style>
</head>
<body id="main-content">

    <div style="text-align: center; color: #444;">
        <h1 style="font-family: sans-serif;">Main Project UI</h1>
        <button class="ra-btn" onclick="Overlay.trigger()">Force System Override</button>
    </div>

    <div id="ra-pixel-canvas"></div>

    <div id="ra-overlay-module">
        <h2 style="letter-spacing: 5px;">ACCESS GRANTED</h2>
        <hr style="border: 0; border-top: 1px solid var(--ra-text-secondary); margin: 20px 0;">
        <p style="color: var(--ra-text-secondary); font-size: 0.9rem;">
            DIRECTORY: ROOT/SYS/CORES<br>
            STATUS: OVERRIDE_SUCCESSFUL
        </p>
        <br>
        <button class="ra-btn" onclick="Overlay.close()">Exit Terminal</button>
    </div>

    <div class="ra-scanlines"></div>

    <script>
        class RetroOverlayModule {
            constructor() {
                this.body = document.body;
                this.canvas = document.getElementById('ra-pixel-canvas');
                this.module = document.getElementById('ra-overlay-module');
                this.gridSize = 400; // 20x20
                this.init();
            }

            init() {
                // Generate the pixel elements
                for (let i = 0; i < this.gridSize; i++) {
                    const pixel = document.createElement('div');
                    pixel.classList.add('ra-pixel');
                    // Random stagger for organic digital fill
                    pixel.style.transitionDelay = `${Math.random() * 0.4}s`;
                    this.canvas.appendChild(pixel);
                }
            }

            trigger() {
                // Step 1: Violent Shake
                this.body.classList.add('ra-glitch-out');

                // Step 2: Pixel Swarm after 400ms
                setTimeout(() => {
                    this.body.classList.remove('ra-glitch-out');
                    this.body.classList.add('ra-show-pixels');

                    // Step 3: Show the Overlay Module
                    setTimeout(() => {
                        this.module.style.display = 'block';
                    }, 500);
                }, 400);
            }

            close() {
                // Hide module and retract pixels
                this.module.style.display = 'none';
                this.body.classList.remove('ra-show-pixels');
            }
        }

        // Initialize the module
        const Overlay = new RetroOverlayModule();
    </script>

</body>
</html>
