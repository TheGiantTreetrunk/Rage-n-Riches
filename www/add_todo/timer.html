<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15-Minute Timer</title>
</head>
<body>

  <div class="container">
    <div id="display">15:00</div>
    <div class="buttons">
      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>
      <button id="resetBtn">Reset</button>
    </div>
  </div>

  <script>
const totalSeconds = 1 * 60; // 15 minutes
    let timeLeft = totalSeconds;
    let timerId = null;

    const display = document.getElementById('display');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resetBtn = document.getElementById('resetBtn');

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function updateDisplay() {
      display.textContent = formatTime(timeLeft);
    }

    function endGame() {
      // Put your game over logic here
      console.log("Time's up! Game over.");
      alert("end game");
    }

    function startTimer() {
      if (timerId !== null) return; // Prevent creating multiple overlapping intervals
      timerId = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          clearInterval(timerId);
          timerId = null;
          endGame(); // Triggered when time runs out
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerId);
      timerId = null;
    }

    function resetTimer() {
      stopTimer();
      timeLeft = totalSeconds;
      updateDisplay();
    }

    startBtn.addEventListener('click', startTimer);
    stopBtn.addEventListener('click', stopTimer);
    resetBtn.addEventListener('click', resetTimer);

    // Run initial display state
    updateDisplay();
  </script>

</body>
</html>
