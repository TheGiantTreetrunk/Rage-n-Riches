<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8-Bit Mushroom Cavern Texture</title>
  <style>
    :root {
      /* Controls the scale of the pixel blocks */
      --pixel-scale: 8px;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b0712;
    }

    .pixel-cavern-bg {
      width: 100%;
      height: 100%;
      background-repeat: repeat;
      
      /* Scales the 32x32 pixel tile up into chunky retro blocks */
      background-size: calc(32 * var(--pixel-scale)) calc(32 * var(--pixel-scale));

      /* Force crisp, un-blurred pixel edges across all browsers */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      image-rendering: -moz-crisp-edges;
    }
  </style>
</head>
<body>

  <div id="cavernBg" class="pixel-cavern-bg"></div>

  <script>
    function generate8BitMushroomCavern() {
      const size = 32; // 32x32 pixel canvas
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // 5-color bioluminescent cavern palette
      const PALETTE = [
        '#181524', // Dark cave rock shadow
        '#3a384c', // Mid-tone slate grey rock
        '#7b2cbf', // Deep purple fungal mass
        '#ff4d6d', // Glowing pink mushroom caps
        '#38b000'  // Electric green bioluminescent spores / moss
      ];

      function pseudoRandom(x, y) {
        const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
        return n - Math.floor(n);
      }

      // Step 1: Base coat with mid-tone slate grey rock (#3a384c)
      ctx.fillStyle = PALETTE[1];
      ctx.fillRect(0, 0, size, size);

      // Step 2: Generate background rock crevices and purple fungal base layers
      for (let y = 0; y < size; y += 2) {
        for (let x = 0; x < size; x += 2) {
          const rand = pseudoRandom(x, y);

          if (rand < 0.28) {
            ctx.fillStyle = PALETTE[0]; // Dark cave shadow/crevice
          } else if (rand > 0.65 && rand <= 0.85) {
            ctx.fillStyle = PALETTE[2]; // Deep purple fungal patch
          } else {
            continue; // Keep base slate grey stone
          }

          ctx.fillRect(x, y, 2, 2);
        }
      }

      // Step 3: Layer glowing pink mushroom caps and neon green spore spots
      for (let y = 0; y < size; y += 4) {
        for (let x = 0; x < size; x += 4) {
          const ShroomRand = pseudoRandom(x * 2.1, y * 2.1);

          if (ShroomRand > 0.72) {
            // Hot pink mushroom cap clusters
            ctx.fillStyle = PALETTE[3];
            ctx.fillRect(x, y, 4, 2);
            ctx.fillRect(x + 2, y + 2, 2, 2);
          } else if (ShroomRand < 0.18) {
            // Neon green glowing spore dots / moss patches
            ctx.fillStyle = PALETTE[4];
            ctx.fillRect(x, y, 2, 2);
            ctx.fillRect(x + 2, y + 2, 2, 2);
          }
        }
      }

      // Set canvas data as repeating background
      const dataUrl = canvas.toDataURL('image/png');
      document.getElementById('cavernBg').style.backgroundImage = `url(${dataUrl})`;
    }

    generate8BitMushroomCavern();
  </script>
</body>
</html>
