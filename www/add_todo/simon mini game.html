<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4-Button Memory Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #1a1a1a;
      color: white;
      margin: 0;
    }

    .game-container {
      text-align: center;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(2, 120px);
      gap: 20px;
      margin: 20px auto;
      width: fit-content;
    }

    .game-btn {
      width: 120px;
      height: 120px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      opacity: 0.6;
      transition: opacity 0.2s, transform 0.1s;
    }

    .game-btn:active, .game-btn.active {
      opacity: 1;
      transform: scale(1.05);
      box-shadow: 0 0 20px white;
    }

    .red { background-color: #ff4757; }
    .blue { background-color: #1e90ff; }
    .green { background-color: #2ed573; }
    .yellow { background-color: #ffa502; }

    #start-btn {
      padding: 10px 24px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background-color: #ffffff;
      color: #1a1a1a;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>Memory Game</h1>
    <h2 id="status">Press "Start" to play!</h2>

    <div class="button-grid">
      <button class="game-btn red" id="red" onclick="handleButtonClick('red')"></button>
      <button class="game-btn blue" id="blue" onclick="handleButtonClick('blue')"></button>
      <button class="game-btn green" id="green" onclick="handleButtonClick('green')"></button>
      <button class="game-btn yellow" id="yellow" onclick="handleButtonClick('yellow')"></button>
    </div>

    <button id="start-btn" onclick="startGame()">Start Game</button>
  </div>

  <script>
    const colors = ['red', 'blue', 'green', 'yellow'];
    let sequence = [];
    let playerSequence = [];
    let round = 1;
    const maxRounds = 3;
    let isAcceptingInput = false;

    function startGame() {
      sequence = [];
      playerSequence = [];
      round = 1;
      document.getElementById('start-btn').style.display = 'none';
      startRound();
    }

    function startRound() {
      playerSequence = [];
      isAcceptingInput = false;
      document.getElementById('status').textContent = `Round ${round} of ${maxRounds}`;

      sequence.push(colors[Math.floor(Math.random() * colors.length)]);

      playSequence();
    }

    function playSequence() {
      let i = 0;
      const interval = setInterval(() => {
        flashButton(sequence[i]);
        i++;
        if (i >= sequence.length) {
          clearInterval(interval);
          setTimeout(() => {
            isAcceptingInput = true;
            document.getElementById('status').textContent = `Round ${round}: Your turn!`;
          }, 500);
        }
      }, 800);
    }

    function flashButton(color) {
      const btn = document.getElementById(color);
      btn.classList.add('active');
      setTimeout(() => {
        btn.classList.remove('active');
      }, 400);
    }

    function handleButtonClick(color) {
      if (!isAcceptingInput) return;

      flashButton(color);
      playerSequence.push(color);

      const currentStep = playerSequence.length - 1;

      if (playerSequence[currentStep] !== sequence[currentStep]) {
        document.getElementById('status').textContent = '❌ Wrong sequence! Game Over.';
        resetGame();
        return;
      }

      if (playerSequence.length === sequence.length) {
        isAcceptingInput = false;
        if (round === maxRounds) {
          document.getElementById('status').textContent = '🎉 Congratulations! You won all 3 rounds!';
          resetGame();
        } else {
          round++;
          document.getElementById('status').textContent = 'Correct! Next round starting...';
          setTimeout(startRound, 1200);
        }
      }
    }

    function resetGame() {
      document.getElementById('start-btn').style.display = 'inline-block';
      document.getElementById('start-btn').textContent = 'Play Again';
      isAcceptingInput = false;
    }
  </script>
</body>
</html>
