<!DOCTYPE html>
<html>
<head>
<style>
.rb_cr_challenge_table {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 80%;
    height: 80%;
    border: 3px solid #ffffff;
    background-color: #000;
    overflow-y: auto; 
    box-shadow: 10px 10px #ffffff;
    color: #fff;
    padding: 0;
    display: flex;
    flex-direction: column;
}

/* The Sticky Header Area */
.rb-cr-container {
    position: sticky;
    top: 0;
    z-index: 1; 
    text-align: center;
    background-color: #000;
    /* Height is determined by the content (Art + Title) */
    padding-bottom: 10px;
}

/* Title and Dice are now both z-index 3 to sit on top of the glass */
.rb_cr_sticky-title {
    position: relative;
    z-index: 3;
    margin: 0;
    padding: 15px 0 5px 0;
    background: transparent;
}

#rb_cr_dice-display {
    position: absolute;
    top: 60%; 
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 80px;
    z-index: 3; 
    text-shadow: 0 0 15px rgba(0,0,0,0.9);
}

/* The Scrolling Content */
.rb-cr-scroll-content {
    background-color: #000000;
    position: relative;
    z-index: 10; 
    padding: 20px;
}

.rb-cr-scroll-content button {
	width: 100%;
}
.rb_cr_table_roll_chart {
    border-collapse: collapse;
    width: 100%;
}
  
.rb_cr_table_roll_chart td {
    padding: 12px;
}
  
.rb_cr_table_roll_chart tr:nth-child(even){background-color: #1a1a1a;}

.rb_cr_dice_button {
    padding: 14px 0px;
    width: 100%;
    margin-bottom: 10px;
    cursor: pointer;
    background: #fff;
    color: #000;
    border: none;
    font-weight: bold;
    text-transform: uppercase;
}

.rb_cr_dice_button:hover {
    background: #ccc;
}
</style>
</head>
<body>

<div class="rb_cr_challenge_table">
    <div class="rb-cr-container">
        <h3 class="rb_cr_sticky-title">The Banquet Table</h3>
        
        
        <div id="rb_cr_dice-display">⚄</div>

        <br><br><br><Br><br><Br>
    </div>

    <div class="rb-cr-scroll-content">
        <hr>
		<p id="qte_banquet_text" style="text-align: center;">You've come across a banquet table! Looks like some table scraps are still left over...</p>
		<hr>
        <table class="rb_cr_table_roll_chart">
            <tr><td>Rolls 6</td><td>Rare Steak</td></tr>
            <tr><td>Rolls 5</td><td>Old Bread</td></tr>
            <tr><td>Rolls 4</td><td>Mystery Soup</td></tr>
            <tr><td>Rolls 3</td><td>Empty Plate</td></tr>
            <tr><td>Rolls 2</td><td>Apple Core</td></tr>
            <tr><td>Rolls 1</td><td>Rat Droppings</td></tr>
        </table>
        <br>
        <button class="rb_cr_dice_button">Roll Dice</button>
        <button class="rb_cr_dice_button">Ok, Got It.</button>
    </div>
</div>

</body>
</html>
